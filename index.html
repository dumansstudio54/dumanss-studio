    { key: 'su_yuzdesi',      label: 'Sıvı Oranı (%)',        renk: 'var(--blue)' },
    { key: 'gunluk_kalori',   label: 'Günlük Kalori',         renk: 'var(--green)' },
    { key: 'bmr',             label: 'BMR (kcal)',             renk: 'var(--green)' },
    { key: 'ic_yaglama',      label: 'İç Yağlanma',           renk: '#E07020' },
    { key: 'metabolizma_yasi',label: 'Metabolizma Yaşı',      renk: 'var(--purple,#8A6A9A)' },
    { key: 'yag_agirlik',     label: 'Yağ Ağırlığı (kg)',     renk: '#E07020' },
    { key: 'sivi_agirlik',    label: 'Sıvı Ağırlığı (kg)',    renk: 'var(--blue)' },
    { key: 'hedef_kilo',      label: 'Hedef Kilo (kg)',        renk: 'var(--green)' },
    { key: 'kemik_kutlesi',   label: 'Kemik Kütlesi',         renk: 'var(--text2)' },
    { key: 'seg_sag_bacak_yag', label: 'Sağ Bacak Yağ%',     renk: '#E07020' },
    { key: 'seg_sol_bacak_yag', label: 'Sol Bacak Yağ%',      renk: '#E07020' },
    { key: 'seg_sag_kol_yag',   label: 'Sağ Kol Yağ%',       renk: '#E07020' },
    { key: 'seg_sol_kol_yag',   label: 'Sol Kol Yağ%',        renk: '#E07020' },
    { key: 'seg_govde_yag',     label: 'Gövde Yağ%',          renk: '#E07020' },
    { key: 'seg_sag_bacak_kas', label: 'Sağ Bacak Kas (kg)',  renk: 'var(--blue)' },
    { key: 'seg_sol_bacak_kas', label: 'Sol Bacak Kas (kg)',   renk: 'var(--blue)' },
    { key: 'seg_sag_kol_kas',   label: 'Sağ Kol Kas (kg)',    renk: 'var(--blue)' },
    { key: 'seg_sol_kol_kas',   label: 'Sol Kol Kas (kg)',     renk: 'var(--blue)' },
    { key: 'seg_govde_kas',     label: 'Gövde Kas (kg)',       renk: 'var(--blue)' },
  ];
  const bulunanlar = alanlar.filter(a => veri[a.key] !== undefined);
  const bulunamayanlar = alanlar.filter(a => veri[a.key] === undefined);
  const modal = document.createElement('div');
  modal.id = 'pdf-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto';
  modal.innerHTML = `
  <div style="background:var(--bg,#FAF7F0);border-radius:16px;width:100%;max-width:540px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden">
    <div style="padding:18px 20px;background:linear-gradient(135deg,#975B09,#946C18,#D2A941);color:white;flex-shrink:0">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:15px;font-weight:700">📄 PDF Okundu — ${bulunanlar.length} alan bulundu</div>
          <div style="font-size:11px;opacity:.85;margin-top:2px">Kontrol edip kaydedin</div>
        </div>
        <button onclick="document.getElementById('pdf-modal').remove()" style="background:rgba(255,255,255,.2);border:none;color:white;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer">✕</button>
      </div>
    </div>
    <div style="overflow-y:auto;padding:18px 20px;flex:1">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div>
          <div style="font-size:10px;letter-spacing:1.5px;color:var(--gold-dark,#946C18);font-weight:600;margin-bottom:5px">TARİH</div>
          <input type="date" id="pdf-tarih" value="${veri.tarih || new Date().toISOString().split('T')[0]}"
            style="width:100%;padding:9px 11px;border:1px solid var(--border,#E8DFD0);border-radius:8px;background:white;color:var(--text,#2A2015);font-size:13px;outline:none">
        </div>
        <div>
          <div style="font-size:10px;letter-spacing:1.5px;color:var(--gold-dark,#946C18);font-weight:600;margin-bottom:5px">ÖĞRENCİ</div>
          <select id="pdf-ogr-sec" style="width:100%;padding:9px 11px;border:1px solid var(--border,#E8DFD0);border-radius:8px;background:white;color:var(--text,#2A2015);font-size:13px">
            ${data.map((o, i) => '<option value="' + i + '"' + (eslenenOgr && data.indexOf(eslenenOgr)===i?' selected':'') + '>' + o.ad + '</option>').join('')}

        </div>
      </div>
      ${eslenenOgr ? '<div style="background:rgba(90,138,90,.1);border:1px solid rgba(90,138,90,.25);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:12px;color:var(--green,#5A8A5A)">✓ <strong>' + eslenenOgr.ad + '</strong> ile eşleşti</div>' : ''}
      <div style="font-size:11px;font-weight:700;color:var(--text,#2A2015);letter-spacing:1px;margin-bottom:10px">DEĞERLER <span style="font-weight:400;color:var(--text3,#A89070)">(düzenleyebilirsiniz)</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        ${bulunanlar.map(a => '<div style="background:white;border:1px solid var(--border,#E8DFD0);border-radius:8px;padding:9px 11px;border-left:3px solid ' + a.renk + '"><div style="font-size:9px;color:var(--text3,#A89070);letter-spacing:1px;font-weight:600;margin-bottom:4px">' + a.label.toUpperCase() + '</div><input type="number" step="0.1" id="pdf-f-' + a.key + '" value="' + veri[a.key] + '" style="width:100%;border:none;background:transparent;font-size:14px;font-weight:700;color:' + a.renk + ';font-family:Georgia,serif;outline:none;padding:0"></div>').join('')}
      </div>
      ${bulunamayanlar.length > 0 ? '<details style="margin-bottom:10px"><summary style="font-size:11px;color:var(--text3,#A89070);cursor:pointer;padding:6px 0">' + bulunamayanlar.length + ' alan bulunamadı — manuel ekle</summary><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">' + bulunamayanlar.map(a => '<div style="background:var(--card2,#FDF9F3);border:1px dashed var(--border,#E8DFD0);border-radius:8px;padding:9px 11px"><div style="font-size:9px;color:var(--text3,#A89070);letter-spacing:1px;font-weight:600;margin-bottom:4px">' + a.label.toUpperCase() + '</div><input type="number" step="0.1" id="pdf-f-' + a.key + '" placeholder="—" style="width:100%;border:none;background:transparent;font-size:13px;color:var(--text,#2A2015);outline:none;padding:0"></div>').join('') + '</div></details>' : ''}
    </div>
    <div style="padding:14px 20px;border-top:1px solid var(--border,#E8DFD0);display:flex;gap:10px;flex-shrink:0;background:var(--bg,#FAF7F0)">
      <button onclick="document.getElementById('pdf-modal').remove()" style="flex:1;padding:11px;border:1px solid var(--border,#E8DFD0);background:white;border-radius:9px;cursor:pointer;font-size:13px;color:var(--text2,#6B5A3A);font-weight:600">İptal</button>
      <button onclick="pdfKaydet()" style="flex:2;padding:11px;background:linear-gradient(135deg,#975B09,#946C18,#D2A941);color:white;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.5px">💾 Supabase'e Kaydet</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.onclick = e => { if (e.target === modal) modal.remove(); };
}

async function pdfKaydet() {
  const ogrIdx = parseInt(document.getElementById('pdf-ogr-sec')?.value);
  const tarih  = document.getElementById('pdf-tarih')?.value;
  if (isNaN(ogrIdx) || !data[ogrIdx]) { alert('Öğrenci seçin!'); return; }
  if (!tarih) { alert('Tarih girin!'); return; }
  const o = data[ogrIdx];
  const f = (id) => {
    const el = document.getElementById('pdf-f-' + id);
    if (!el || !el.value) return null;
    const v = parseFloat(el.value);
    return isNaN(v) ? null : v;
  };
  const row = {
    ogrenci_id:o._id, tarih,
    kilo:f('kilo'), bmi:f('bmi'), yag_yuzdesi:f('yag_yuzdesi'),
    su_yuzdesi:f('su_yuzdesi'), kas_yuzdesi:f('kas_yuzdesi'),
    gunluk_kalori:f('gunluk_kalori'), bmr:f('bmr'),
    ic_yaglama:f('ic_yaglama'), metabolizma_yasi:f('metabolizma_yasi'),
    yag_agirlik:f('yag_agirlik'), sivi_agirlik:f('sivi_agirlik'),
    hedef_kilo:f('hedef_kilo'), kemik_kutlesi:f('kemik_kutlesi'),
    seg_sag_bacak_yag:f('seg_sag_bacak_yag'), seg_sol_bacak_yag:f('seg_sol_bacak_yag'),
    seg_sag_kol_yag:f('seg_sag_kol_yag'),     seg_sol_kol_yag:f('seg_sol_kol_yag'),
    seg_govde_yag:f('seg_govde_yag'),
    seg_sag_bacak_kas:f('seg_sag_bacak_kas'), seg_sol_bacak_kas:f('seg_sol_bacak_kas'),
    seg_sag_kol_kas:f('seg_sag_kol_kas'),     seg_sol_kol_kas:f('seg_sol_kol_kas'),
    seg_govde_kas:f('seg_govde_kas'),
  };
  Object.keys(row).forEach(k => { if (row[k] === null) delete row[k]; });
  const saveBtn = document.querySelector('#pdf-modal button:last-child');
  if (saveBtn) { saveBtn.disabled=true; saveBtn.textContent='⏳ Kaydediliyor...'; }
  try {
    const { error } = await sb.from('olcumler').insert(row);
    if (error) throw error;
    document.getElementById('pdf-modal')?.remove();
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#5A8A5A;color:white;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9998;box-shadow:0 4px 16px rgba(0,0,0,.2)';
    toast.textContent = '✅ ' + o.ad + ' için ölçüm kaydedildi!';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
    olcumOgrIdx = ogrIdx;
    renderOlcum();
  } catch(e) {
    alert('❌ Kayıt hatası: ' + e.message);
    if (saveBtn) { saveBtn.disabled=false; saveBtn.textContent="💾 Supabase'e Kaydet"; }
  }
}

async function olcumOzetHtml() {
  const { data: hepsi, error } = await sb.from('olcumler').select('ogrenci_id,tarih,kilo,yag_yuzdesi,kas_yuzdesi').order('tarih', { ascending: true });
  if (error || !hepsi || !hepsi.length) return '';
  const gruplar = {};
  hepsi.forEach(o => { (gruplar[o.ogrenci_id] = gruplar[o.ogrenci_id] || []).push(o); });

  let zayiflayan = 0, toplamKiloKaybi = 0, yagKaybeden = 0, kasKazanan = 0, ilerlemeYok = 0;
  Object.values(gruplar).forEach(arr => {
    if (arr.length < 2) return;
    const ilk = arr[0], son = arr[arr.length-1];
    const kiloFark = (son.kilo||0) - (ilk.kilo||0);
    const yagFark = (son.yag_yuzdesi||0) - (ilk.yag_yuzdesi||0);
    const kasFark = (son.kas_yuzdesi||0) - (ilk.kas_yuzdesi||0);
    if (kiloFark < -0.3) { zayiflayan++; toplamKiloKaybi += Math.abs(kiloFark); }
    else if (kiloFark > 0.3 || yagFark < -0.3 || kasFark > 0.3) { /* değişim var ama kilo artmış olabilir */ }
    else ilerlemeYok++;
    if (yagFark < -0.3) yagKaybeden++;
    if (kasFark > 0.3) kasKazanan++;
  });
  const ogrSayisi = Object.keys(gruplar).filter(id => gruplar[id].length >= 2).length;
  if (!ogrSayisi) return '';

  return `
  <div style="padding:16px 16px 4px">
    <div style="font-size:10px;font-weight:700;color:var(--gold-dark);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">TÜM ÖĞRENCİLER — İLERLEME ÖZETİ (${ogrSayisi} öğrenci, 2+ ölçüm)</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px">
      <div class="card" style="padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:var(--green)">${zayiflayan}</div><div style="font-size:9.5px;color:var(--text3);margin-top:2px">Kilo Verdi</div></div>
      <div class="card" style="padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:var(--gold-dark)">${toplamKiloKaybi.toFixed(1)}kg</div><div style="font-size:9.5px;color:var(--text3);margin-top:2px">Toplam Kayıp</div></div>
      <div class="card" style="padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:#E07020">${yagKaybeden}</div><div style="font-size:9.5px;color:var(--text3);margin-top:2px">Yağ Oranı Düştü</div></div>
      <div class="card" style="padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:var(--blue)">${kasKazanan}</div><div style="font-size:9.5px;color:var(--text3);margin-top:2px">Kas Oranı Arttı</div></div>
      <div class="card" style="padding:12px;text-align:center"><div style="font-size:20px;font-weight:800;color:var(--text3)">${ilerlemeYok}</div><div style="font-size:9.5px;color:var(--text3);margin-top:2px">Değişim Yok</div></div>
    </div>
  </div>`;
}

async function renderOlcum() {
  const el = document.getElementById('olcum-c');
  if (!data.length) { el.innerHTML='<div class="alert a-blue" style="margin:12px 16px">Önce öğrenci ekle.</div>'; return; }
  const o = data[olcumOgrIdx];
  gosterYukleniyor();
  const ozetHtml = await olcumOzetHtml();
  try {
    const {data:d,error} = await sb.from('olcumler').select('*').eq('ogrenci_id',o._id).order('tarih',{ascending:true});
    if (!error) olcumler = d||[];
  } catch(e) { olcumler=[]; }
  gizleYukleniyor();
  const son = olcumler.length ? olcumler[olcumler.length-1] : null;
  const ilk = olcumler.length > 1 ? olcumler[0] : null;
  let html = ozetHtml + `
  <div style="padding:12px 16px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)">
    <select style="flex:1;min-width:130px" onchange="olcumOgrIdx=parseInt(this.value);renderOlcum()">
      ${data.map((d,i)=>'<option value="'+i+'"'+(i===olcumOgrIdx?' selected':'')+'>'+d.ad+'</option>').join('')}
    </select>
    <label id="pdf-yukle-btn" style="display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:linear-gradient(135deg,#975B09,#946C18);color:white;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.5px;box-shadow:0 2px 8px rgba(148,108,24,.25)">
      📄 PDF Yükle
      <input type="file" accept=".pdf" style="display:none" onchange="pdfYukle(event)">
    </label>
    <button class="btn btn-ghost btn-sm" onclick="manuelOlcumEkle()">➕ Manuel</button>
  </div>
  <div id="pdf-durum" style="display:none;padding:0 16px"></div>`;

  if (!son) {
    html += '<div class="alert a-blue" style="margin:12px 16px">📄 '+o.ad+' için henüz ölçüm yok. Yukaridaki PDF Yukle butonunu kullanin.</div>';
    el.innerHTML = html; return;
  }
  const kiloFark = ilk ? ((son.kilo||0)-(ilk.kilo||0)).toFixed(1) : null;
  const hasSeg = son.seg_sag_bacak_yag || son.seg_sol_bacak_yag;

  // Metrikler
  html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px 8px">';
  if(son.kilo) html+='<div class="metric-card" style="border-top:3px solid var(--gold-dark)"><div class="metric-label">KİLO</div><div style="font-size:24px;font-weight:800;font-family:Georgia,serif">'+son.kilo+'</div>'+(kiloFark?'<div style="font-size:11px;font-weight:600;color:'+(parseFloat(kiloFark)<0?'var(--green)':'var(--red)')+'">'+( parseFloat(kiloFark)>0?'+':'')+kiloFark+'kg</div>':'')+'</div>';
  if(son.yag_yuzdesi) html+='<div class="metric-card" style="border-top:3px solid #E07020"><div class="metric-label">YAĞ%</div><div style="font-size:24px;font-weight:800;color:#E07020;font-family:Georgia,serif">'+son.yag_yuzdesi+'%</div></div>';
  if(son.bmi) html+='<div class="metric-card" style="border-top:3px solid var(--blue)"><div class="metric-label">BMI</div><div style="font-size:24px;font-weight:800;color:var(--blue);font-family:Georgia,serif">'+son.bmi+'</div><div style="font-size:9px;color:var(--text3)">'+( son.bmi<25?'Normal':son.bmi<30?'Fazla':'Obez')+'</div></div>';
  if(son.gunluk_kalori) html+='<div class="metric-card" style="border-top:3px solid var(--green)"><div class="metric-label">KALORİ</div><div style="font-size:20px;font-weight:800;color:var(--green);font-family:Georgia,serif">'+son.gunluk_kalori+'</div><div style="font-size:9px;color:var(--text3)">kcal/gün</div></div>';
  html += '</div>';

  // Fark analizi
  if (ilk) {
    const fs=[['Kilo','kilo','kg'],['Yağ%','yag_yuzdesi','%'],['Sıvı%','su_yuzdesi','%'],['Yağ kg','yag_agirlik','kg']];
    html+='<div style="padding:0 16px 8px"><div style="font-size:10px;font-weight:700;color:var(--gold-dark);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">FARK ANALİZİ</div><div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden"><table style="width:100%;font-size:11px;border-collapse:collapse"><thead><tr style="background:var(--card2)"><th style="padding:7px 10px;text-align:left;color:var(--text3)">Alan</th><th style="padding:7px 8px;text-align:center;color:var(--text3)">'+new Date(ilk.tarih).toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})+'</th><th style="padding:7px 8px;text-align:center;color:var(--text3)">'+new Date(son.tarih).toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"})+'</th><th style="padding:7px 8px;text-align:center;color:var(--text3)">Fark</th></tr></thead><tbody>';
    fs.forEach(([label,key,unit])=>{
      const v1=ilk[key],v2=son[key];
      if(!v1||!v2)return;
      const f=(v2-v1).toFixed(1);
      const r=parseFloat(f)===0?'var(--text3)':parseFloat(f)<0?'var(--green)':'var(--red)';
      html+='<tr style="border-bottom:0.5px solid var(--border)"><td style="padding:7px 10px;color:var(--text2)">'+label+'</td><td style="padding:7px 8px;text-align:center">'+v1+unit+'</td><td style="padding:7px 8px;text-align:center;font-weight:600">'+v2+unit+'</td><td style="padding:7px 8px;text-align:center;font-weight:700;color:'+r+'">'+(parseFloat(f)>0?'+':'')+f+unit+'</td></tr>';
    });
    html+='</tbody></table></div></div>';
  }

  // Segmental + Metabolizma
  if (hasSeg || son.bmr) {
    html+='<div style="display:grid;grid-template-columns:'+(window.innerWidth>=768?'1fr 1fr':'1fr')+';gap:12px;padding:0 16px 8px">';
    if(hasSeg){
      html+='<div><div style="font-size:10px;font-weight:700;color:var(--gold-dark);letter-spacing:1.5px;margin-bottom:8px">SEGMENTAL</div><div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden"><table style="width:100%;font-size:11px;border-collapse:collapse"><thead><tr style="background:var(--card2)"><th style="padding:7px 10px;text-align:left;color:var(--text3)">Bölge</th><th style="padding:7px 8px;text-align:center;color:var(--text3)">Yağ%</th><th style="padding:7px 8px;text-align:center;color:var(--text3)">Kas kg</th></tr></thead><tbody>';
      [['Sağ Bacak','seg_sag_bacak'],['Sol Bacak','seg_sol_bacak'],['Sağ Kol','seg_sag_kol'],['Sol Kol','seg_sol_kol'],['Gövde','seg_govde']].forEach(([n,k])=>{
        const y=son[k+'_yag'],m=son[k+'_kas'];
        if(!y)return;

  }

  // Tüm ölçümler tablosu - aylık gruplu
  html+='<div style="padding:0 16px 16px"><div style="font-size:10px;font-weight:700;color:var(--gold-dark);letter-spacing:1.5px;margin-bottom:8px">TÜM ÖLÇÜMLER</div><div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:auto"><table style="width:100%;font-size:11px;border-collapse:collapse;min-width:320px"><thead><tr style="background:var(--card2)"><th style="padding:8px 10px;text-align:left;color:var(--text2)">Tarih</th><th style="padding:8px 6px;text-align:center;color:var(--text2)">Kilo</th><th style="padding:8px 6px;text-align:center;color:var(--text2)">Yağ%</th><th style="padding:8px 6px;text-align:center;color:var(--text2)">BMI</th><th style="padding:8px 6px;text-align:center;color:var(--text2)">Sıvı%</th><th style="padding:8px 6px"></th></tr></thead><tbody>';
  const aylar2=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const gruplar={};
  olcumler.forEach(ol=>{const d=new Date(ol.tarih);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(!gruplar[k])gruplar[k]=[];gruplar[k].push(ol);});

window._silOlcum = async function(id) {
  if(!confirm('Bu ölçüm silinsin mi?')) return;
  gosterYukleniyor();
  try {
    const {error} = await sb.from('olcumler').delete().eq('id', id);
    if(error) throw error;
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#C03010;color:white;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.2)';
    toast.textContent = '🗑 Ölçüm silindi';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
    await renderOlcum();
  } catch(e) {
    alert('Hata: ' + e.message);
  } finally {
    gizleYukleniyor();
  }
};

function olcumRaporu(idx){
  const o=data[idx];
  if(!olcumler.length)return'Ölçüm yok.';
  const son=olcumler[olcumler.length-1];
  const ilk=olcumler[0];
  const kiloFark=olcumler.length>1?((son.kilo||0)-(ilk.kilo||0)).toFixed(1):null;
  return `DUMANSSTUDIO — ${o.ad} Ölçüm Raporu\n\n📅 Son ölçüm: ${new Date(son.tarih).toLocaleDateString('tr-TR')}\n⚖️ Kilo: ${son.kilo||'-'} kg\n🔥 Yağ: ${son.yag_yuzdesi||'-'}%\n💪 Kas: ${son.kas_yuzdesi||'-'}%\n📊 BMI: ${son.bmi||'-'}${kiloFark!==null?`\n\n📈 Değişim: ${kiloFark>0?'+':''}${kiloFark} kg`:''}\n\nDUMANSSTUDIO | Sakarya`;
}

async function olcumMailGonder(idx){
  const o=data[idx];
  if(!o.mail){alert('Mail adresi yok!');return;}
  await mailGonder(o.mail,'DUMANSSTUDIO — Ölçüm Raporunuz',olcumRaporu(idx));
}

function olcumWaGonder(idx){
  const o=data[idx];
  if(!o.tel){alert('Telefon yok!');return;}
  const numara=(o.tel||'').replace(/\D/g,'');
  const intNum=numara.startsWith('0')?'90'+numara.slice(1):numara;
  window.open(`https://wa.me/${intNum}?text=${encodeURIComponent(olcumRaporu(idx))}`,'_blank');
}

async function topluHatirlatma(){
  const liste=data.filter(o=>(efektifKalan(o)<=3&&efektifKalan(o)>0)||kalanDers(o)===0||gecikmiMi(o));
  if(!liste.length){alert('Hatırlatma gereken öğrenci yok!');return;}
  if(!confirm(`${liste.length} öğrenciye hatırlatma gönderilsin mi?`))return;
  for(const o of liste){
    if(o.mail){
      const mesaj=`Merhaba ${o.ad} Hanım,\n\n${efektifKalan(o)<=0?'Paketinizin süresi dolmuştur.':efektifKalan(o)<=3?`Son ${efektifKalan(o)} dersiniz kaldı.`:'Ödeme zamanınız geldi.'}\n\nDUMANSSTUDIO`;
      await mailGonder(o.mail,'DUMANSSTUDIO — Hatırlatma',mesaj);
    }
  }
}

async function kaydet(){
  const ad=document.getElementById('f-ad')?.value?.trim();
  if(!ad){alert('Ad zorunlu!');return;}
  // Yeni öğrencinin telefonu arşivde varsa önce geri yükleme önerilir.
  if(duzenlemeIdx===-1 && await arsivEslesmesiSor(document.getElementById('f-tel')?.value)) return;
  const gunler=Array.from(document.querySelectorAll('input[type=checkbox]:checked')).filter(c=>c.id!=='f-ilkodeme').map(c=>parseInt(c.value));
  const tur=document.getElementById('f-tur')?.value||'pilates';
  const saat=document.getElementById('f-saat')?.value||'';

  // Kapasite kontrolü
  if(duzenlemeIdx===-1){
    const ayniSaatGun=data.filter(o=>o.tur===tur&&o.saat===saat&&gunler.some(g=>(o.gunler||[]).includes(g)));
    const max=tur==='ems'?2:3;
    if(ayniSaatGun.length>=max){alert(`❌ ${tur.toUpperCase()} dersinde bu saat dolu! (max ${max} kişi)`);return;}
  }

  const ilkOdemeAlindi=document.getElementById('f-ilkodeme')?!document.getElementById('f-ilkodeme').checked:true;
  // Düzenlemede formda olmayan bilgiler (toplam paket, ödeme durumu, borç…) korunur.
  const onceki=duzenlemeIdx>-1?data[duzenlemeIdx]:null;
  const paket=parseInt(document.getElementById('f-paket')?.value)||20;
  let davetEden=onceki?onceki.davetEden:null;
  const davetKod=(document.getElementById('f-davet')?.value||'').trim().toUpperCase();
  if(!onceki&&davetKod){
    const davetci=data.find(x=>(x.davetKodu||'').toUpperCase()===davetKod);
    if(!davetci){alert('Bu davet kodu bulunamadı: '+davetKod);return;}
    davetEden=davetci._id;
  }
  const o={
    ...(onceki||{}),
    _id: onceki?onceki._id:undefined,
    ad, tel:document.getElementById('f-tel')?.value||'',
    mail:document.getElementById('f-mail')?.value||'',
    dogumTarihi:document.getElementById('f-dogum')?.value||null,
    tur, paket,
    ucret:parseFloat(document.getElementById('f-ucret')?.value)||0,
    saat, gunler, iptalHakki:parseInt(document.getElementById('f-iptal')?.value)??1,
    toplam_paket:onceki?(onceki.toplam_paket||paket):paket,
    yapilan:onceki?onceki.yapilan:0,
    borc:onceki?onceki.borc:0,
    baslangic:onceki?onceki.baslangic:null,
    odemeBekliyor:onceki?onceki.odemeBekliyor:false,
    ilkOdemeAlindi:onceki?onceki.ilkOdemeAlindi:ilkOdemeAlindi,
    davetEden,
  };

  gosterYukleniyor();
  try{
    await ogrKaydet(o);
    const yeniKayit=duzenlemeIdx===-1;
    if(!yeniKayit){data[duzenlemeIdx]=o;}
    else{data.push(o);}
    await veriYukle();
    duzenlemeIdx=-1;
    renderEkleForm();
    renderAna();
    sp('ogr');
    if(yeniKayit) kayitSonrasi(o, ilkOdemeAlindi);
  }catch(e){alert('Hata: '+e.message);}
  finally{gizleYukleniyor();}
}

function bultenHedefDegisti() {
  const tip = document.querySelector('input[name="bhedef"]:checked').value;
  document.getElementById('bulten-ogrenci-sec').style.display = tip === 'ogrenci' ? 'block' : 'none';
}

async function bultenYayinla() {
  const baslik = document.getElementById('bulten-baslik').value.trim();
  const icerik = document.getElementById('bulten-icerik').value.trim();
  const tip = document.querySelector('input[name="bhedef"]:checked').value;
  const ogrId = document.getElementById('bulten-ogrenci').value;

  if (!baslik || !icerik) { alert('❌ Konu başlığı ve içerik gerekli!'); return; }
  if (tip === 'ogrenci' && !ogrId) { alert('❌ Lütfen bir öğrenci seçin!'); return; }

  const { error } = await sb.from('bultenler').insert({
    baslik, icerik,
    hedef_tip: tip,
    ogrenci_id: tip === 'ogrenci' ? ogrId : null
  });
  if (error) { alert('❌ Hata: ' + error.message + '\n\n(Supabase\'de "bultenler" tablosunu oluşturmayı unutmadınız mı?)'); return; }

  const gonderTip = tip;
  const gonderOgrId = ogrId;
  document.getElementById('bulten-baslik').value = '';
  document.getElementById('bulten-icerik').value = '';
  document.querySelector('input[name="bhedef"][value="tumu"]').checked = true;
  bultenHedefDegisti();
  bultenListesiYukle();

  if (confirm('✅ Bülten yayınlandı!\n\n📱 Aynı içerik WhatsApp\'tan da toplu gönderilsin mi?')) {
    bultenWhatsappGonder(baslik, icerik, gonderTip, gonderOgrId);
  }
}

function bultenWhatsappMesaji(baslik, icerik) {
  return `*${baslik}*\n\n${icerik}\n\n💪 DumansStudio | Sakarya`;
}
async function bultenWhatsappGonder(baslik, icerik, tip, ogrId) {
  let hedefler = [];
  if (tip === 'ogrenci') {
    const o = (data||[]).find(x => x._id === ogrId);
    if (o && o.tel) hedefler = [o];
  } else {
    hedefler = (data||[]).filter(o => o.tel);
  }
  if (!hedefler.length) { alert('Gönderilecek telefon numarası bulunamadı.'); return; }
  const mesaj = bultenWhatsappMesaji(baslik, icerik);
  let idx = 0;
  function sonraki() {
    if (idx >= hedefler.length) return;
    const o = hedefler[idx];
    const numara = (o.tel||'').replace(/\D/g,'');
    const intNum = numara.startsWith('0') ? '90'+numara.slice(1) : numara;
    window.open(`https://wa.me/${intNum}?text=${encodeURIComponent(mesaj)}`, '_blank');
    idx++;
    if (idx < hedefler.length) setTimeout(sonraki, 1500);
  }
  sonraki();
}

async function bultenListesiYukle() {
  const listEl = document.getElementById('bulten-liste');
  if (!listEl) return;
  const { data: rows, error } = await sb.from('bultenler').select('*').order('olusturulma', { ascending: false });
  if (error) { listEl.innerHTML = `<div style="font-size:12px;color:var(--red)">Yüklenemedi: ${error.message}</div>`; return; }

  const now = Date.now();
  const aktif = (rows || []).filter(r => now - new Date(r.olusturulma).getTime() < 24 * 3600 * 1000);

  if (!aktif.length) {
    listEl.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:8px 0">Bugün henüz bülten yayınlanmadı.</div>';
    return;
  }

  listEl.innerHTML = aktif.map(r => {
    const hedefTxt = r.hedef_tip === 'tumu' ? 'Tüm Öğrenciler' : ((data||[]).find(o => o.id === r.ogrenci_id)?.ad || 'Öğrenci');
    const kalanSaat = Math.max(0, Math.round(24 - (now - new Date(r.olusturulma).getTime()) / 3600000));
    const kisa = r.icerik.length > 140 ? r.icerik.slice(0, 140) + '…' : r.icerik;
    return `
      <div class="card" style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px">
          <div style="font-size:12.5px;font-weight:600;color:var(--text)">${r.baslik}</div>
          <span class="b-pilates" style="flex-shrink:0">${hedefTxt}</span>
        </div>
        <div style="font-size:11px;color:var(--text3);line-height:1.6;white-space:pre-line">${kisa}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
          <span style="font-size:10px;color:var(--text3)">⏳ ${kalanSaat} saat kaldı</span>
          <button class="btn btn-ghost btn-sm" onclick="bultenSil('${r.id}')">🗑 Kaldır</button>
        </div>
      </div>`;
  }).join('');
}

async function bultenSil(id) {
  if (!confirm('Bu bülteni kaldırmak istiyor musunuz?')) return;
  const { error } = await sb.from('bultenler').delete().eq('id', id);
  if (error) { alert('Hata: ' + error.message); return; }
  bultenListesiYukle();
}

// ── 14 GÜNLÜK HATIRLATMA: giderleri girin, gelen ödemeleri kontrol edin ──
// Son kontrol tarihi veritabanında (yonetici_ayarlar) tutulur; telefon ve bilgisayarda aynı durum görünür.
const FINANS_KONTROL_GUN = 14;
async function finansAyarKaydet(deger) {
  await sb.from('yonetici_ayarlar').upsert({anahtar:'finans_kontrol', deger, guncelleme:new Date().toISOString()});
}
async function finansHatirlatici(zorla) {
  let ayar = {};
  try {
    const {data:r} = await sb.from('yonetici_ayarlar').select('deger').eq('anahtar','finans_kontrol').maybeSingle();
    ayar = (r && r.deger) || {};
  } catch(e) { return; }
  const bugunS = todayStr();
  const gunFarki = (s) => s ? Math.floor((new Date(bugunS) - new Date(s)) / 864e5) : Infinity;
  if(!zorla) {
    if(ayar.ertele && ayar.ertele > bugunS) return;
    if(gunFarki(ayar.son_kontrol) < FINANS_KONTROL_GUN) return;
  }
  const sinir = new Date(); sinir.setDate(sinir.getDate() - FINANS_KONTROL_GUN);
  const son14 = gelirData.filter(g => g.tarih && new Date(g.tarih) >= sinir);
  const toplam = (tip) => son14.filter(g=>g.tip===tip).reduce((t,g)=>t+(+g.tutar||0),0);
  const tl = (n) => '₺' + Math.round(n).toLocaleString('tr-TR');
  const odemeBildiren = data.filter(o=>o.odemeBekliyor);
  const ilkOdeme = data.filter(o=>!o.ilkOdemeAlindi);
  const borclu = data.filter(o=>(o.borc||0)>0);
  const paketBitti = data.filter(o=>kalanDers(o)===0 || gecikmiMi(o));
  const liste = (baslik, arr, renk) => arr.length ? `<div style="margin-top:10px"><div style="font-size:11px;font-weight:700;color:${renk};letter-spacing:.5px">${baslik} (${arr.length})</div><div style="font-size:12px;color:var(--text2);margin-top:3px">${arr.map(o=>o.ad).join(', ')}</div></div>` : '';
  const sonKontrol = ayar.son_kontrol ? new Date(ayar.son_kontrol).toLocaleDateString('tr-TR') : 'henüz yapılmadı';
  const ov = document.createElement('div');
  ov.id = 'finans-hatirlatici';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,14,6,.55);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = `<div style="background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--gold-dark)">⏰ ${FINANS_KONTROL_GUN} GÜNLÜK KONTROL</div>
    <div style="font-size:19px;font-weight:700;margin:6px 0 4px">Giderlerinizi girin, gelen ödemeleri kontrol edin</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:14px">Son kontrol: ${sonKontrol}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
      <div style="background:var(--card2);border-radius:10px;padding:10px 4px"><div style="font-size:10px;color:var(--text3)">Son ${FINANS_KONTROL_GUN} gün gelir</div><div style="font-weight:700;color:var(--green)">${tl(toplam('gelir'))}</div></div>
      <div style="background:var(--card2);border-radius:10px;padding:10px 4px"><div style="font-size:10px;color:var(--text3)">Son ${FINANS_KONTROL_GUN} gün gider</div><div style="font-weight:700;color:var(--red)">${tl(toplam('gider'))}</div></div>
      <div style="background:var(--card2);border-radius:10px;padding:10px 4px"><div style="font-size:10px;color:var(--text3)">Gider kaydı</div><div style="font-weight:700">${son14.filter(g=>g.tip==='gider').length} adet</div></div>
    </div>
    ${son14.filter(g=>g.tip==='gider').length===0?'<div class="alert a-yellow" style="margin-top:12px;font-size:12px">Son 14 günde hiç gider girilmemiş. Kira, fatura, malzeme gibi harcamaları eklemeyi unutmayın.</div>':''}
    ${liste('💳 Ödeme yaptığını bildirenler — onay bekliyor', odemeBildiren, 'var(--red)')}
    ${liste('⏳ İlk ödemesi beklenenler', ilkOdeme, 'var(--red)')}
    ${liste('⚠️ Ders borcu olanlar', borclu, '#A03000')}
    ${liste('📦 Paketi biten / süresi dolanlar', paketBitti, 'var(--gold-dark)')}
    ${!odemeBildiren.length&&!ilkOdeme.length&&!borclu.length&&!paketBitti.length?'<div class="alert a-green" style="margin-top:12px;font-size:12px">✓ Bekleyen ödeme veya borçlu öğrenci yok.</div>':''}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:18px">
      <button class="btn btn-ghost btn-sm" data-git="gelir">➕ Gider ekle</button>
      <button class="btn btn-ghost btn-sm" data-git="ana">💳 Ödemeleri gör</button>
      <button class="btn btn-ghost btn-sm" data-ertele="1">Yarın hatırlat</button>
      <button class="btn btn-primary btn-sm" style="margin-left:auto" data-tamam="1">✓ Kontrol ettim</button>
    </div></div>`;
  ov.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if(!b) return;
    if(b.dataset.git) { ov.remove(); sp(b.dataset.git); return; }
    if(b.dataset.ertele) { const y = new Date(); y.setDate(y.getDate()+1); await finansAyarKaydet({...ayar, ertele:`${y.getFullYear()}-${pad(y.getMonth()+1)}-${pad(y.getDate())}`}); ov.remove(); return; }
    if(b.dataset.tamam) { await finansAyarKaydet({son_kontrol:bugunS}); ov.remove(); return; }
  });
  document.getElementById('finans-hatirlatici')?.remove();
  document.body.appendChild(ov);
}
</script>

      var sp=document.createElement('span');
      if(HARITA[k]){sp.innerHTML=window.dsIc(HARITA[k]);parca.appendChild(sp.firstChild);if(bosluk)parca.appendChild(document.createTextNode(' '));}
      else if(NOKTA[k]){sp.className='ds-nokta';sp.style.background=NOKTA[k];parca.appendChild(sp);if(bosluk)parca.appendChild(document.createTextNode(' '));}
      son=m.index+m[0].length;
    }
    if(son<t.length)parca.appendChild(document.createTextNode(t.slice(son)));
    ust.replaceChild(parca,node);
  }
  function tara(kok){
    if(kok.nodeType===3){isle(kok);return;}
    if(kok.nodeType!==1||ATLA[kok.nodeName])return;
    if(kok.placeholder&&RE.test(kok.placeholder)){kok.placeholder=temizMetin(kok.placeholder);}
    RE.lastIndex=0;
    var w=document.createTreeWalker(kok,NodeFilter.SHOW_TEXT,null),liste=[],n;
    while((n=w.nextNode()))liste.push(n);
    liste.forEach(isle);
    kok.querySelectorAll&&kok.querySelectorAll('[placeholder]').forEach(function(e){RE.lastIndex=0;if(RE.test(e.placeholder))e.placeholder=temizMetin(e.placeholder);});
  }
  function basla(){
    tara(document.body);
    new MutationObserver(function(ks){ks.forEach(function(k){
      if(k.type==='characterData')tara(k.target);
      else k.addedNodes.forEach(tara);
    });}).observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',basla);else basla();

  // Sistem pencerelerindeki (onay / uyarı) emojileri de kaldır
  var a=window.alert,c=window.confirm,p=window.prompt;
  window.alert=function(m){return a.call(window,window.dsEmojisiz(String(m)));};
  window.confirm=function(m){return c.call(window,window.dsEmojisiz(String(m)));};
  window.prompt=function(m,d){return p.call(window,window.dsEmojisiz(String(m)),d);};
})();
</script>
