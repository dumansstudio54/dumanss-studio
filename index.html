*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  margin:0;padding:0;
}

/* ── SPLASH ── */
/* Splash kaldırıldı */

/* ── LOGIN ── */
#login-screen{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;
  background:radial-gradient(120% 90% at 50% 40%,#0d0b09 0%,#070608 60%,#050406 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  overflow-y:auto;
}
#login-screen.show{display:flex}
#login-screen.show{display:flex}
.login-top-bar{
  height:3px;
  background:linear-gradient(90deg,var(--cream),var(--gold-light),var(--gold),var(--gold-dark),var(--gold-deep));
}
.login-hero{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 24px 0;
  text-align:center;
}
.login-logo-wrap{
  width:110px;height:110px;
  background:white;
  border-radius:50%;
  border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(148,108,24,.15);
  margin-bottom:18px;
}
.login-logo-wrap img{width:95px;height:95px;object-fit:contain}
.login-brand{font-family:Georgia,serif;font-size:20px;font-weight:700;letter-spacing:3px;color:var(--text);margin-bottom:3px}
.login-brand-sub{font-size:9px;letter-spacing:3px;color:var(--gold-dark);margin-bottom:20px}
.login-welcome{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:24px}
.login-welcome strong{color:var(--text);font-weight:600}

.login-form{width:100%;max-width:380px;padding:0 24px 32px}
.field-group{margin-bottom:14px}
.field-label{font-size:10px;letter-spacing:1.5px;color:var(--gold-dark);font-weight:600;margin-bottom:7px}
.field-input{
  width:100%;padding:13px 15px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);font-size:14px;
  transition:border-color .2s;
  outline:none;
}
.field-input:focus{border-color:var(--gold)}
.btn-login{
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--gold-deep),var(--gold-dark),var(--gold));
  color:white;border:none;
  border-radius:var(--radius-sm);
  font-size:13px;font-weight:700;
  letter-spacing:2px;cursor:pointer;
  box-shadow:0 4px 16px rgba(148,108,24,.3);
  transition:opacity .2s;
  margin-bottom:16px;
}
.btn-login:active{opacity:.9}
.login-divider{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;
}
.login-divider::before,.login-divider::after{
  content:'';flex:1;height:1px;background:var(--border);
}
.login-divider span{font-size:9px;letter-spacing:1.5px;color:var(--text3)}
.login-hint{font-size:11px;color:var(--text3);text-align:center;line-height:1.7}
.login-footer{
  padding:12px 24px;
  border-top:1px solid var(--border);
  text-align:center;
  font-size:9px;letter-spacing:1px;color:var(--text3);
}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;min-height:100vh;min-height:100dvh}
#app.show{display:flex}

/* TOP BAR */
.top-bar{
  position:sticky;top:0;z-index:100;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:0 16px;
  height:56px;
  display:flex;align-items:center;gap:10px;
}
.top-bar-logo{
  width:34px;height:34px;
  background:white;border-radius:50%;
  border:1px solid var(--border2);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.top-bar-logo img{width:36px;height:36px;object-fit:contain}
.top-bar-text{flex:1}
.top-bar-title{
  font-size:13px;font-weight:700;
  letter-spacing:2px;color:var(--text);
  font-family:Georgia,serif;
  background:linear-gradient(90deg,var(--gold-dark),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.top-bar-date{font-size:10px;color:var(--text3)}
.top-bar-actions{display:flex;gap:6px}
.icon-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);
  background:var(--card2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;
}

/* PAGES */
.page{display:none;flex:1;overflow-y:auto;padding-bottom:72px}
.page.active{display:block}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--bg);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 20px rgba(148,108,24,.06);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 4px 6px;
  cursor:pointer;border:none;background:transparent;
  color:var(--text3);font-size:10px;gap:3px;
  transition:color .2s;
}
.nav-btn.active{color:var(--gold-dark)}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:9px;letter-spacing:.3px}

/* CARDS & COMPONENTS */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:0 1px 8px rgba(148,108,24,.06);
}
.card2{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.section-title{
  font-size:11px;font-weight:600;
  letter-spacing:1.5px;color:var(--gold-dark);
  padding:16px 16px 8px;
  text-transform:uppercase;
}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 4px}
.metric-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px;
}
.metric-label{font-size:11px;color:var(--text3);letter-spacing:1.5px;margin-bottom:8px;text-transform:uppercase;font-weight:500}
.metric-value{font-size:28px;font-weight:700;color:var(--text);font-family:Georgia,serif;letter-spacing:-0.5px}
.metric-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* DERS KARTI */
.ders-item{
  padding:14px 16px;
  border-left:3px solid var(--gold);
  background:var(--card);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  margin:0 20px 10px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 8px rgba(148,108,24,.06);
}
.ders-saat{font-size:17px;font-weight:700;color:var(--text2);min-width:46px;font-family:Georgia,serif}
.ders-divider{width:1px;height:32px;background:var(--border)}
.ders-info{flex:1}
.ders-ad{font-size:13px;font-weight:600;color:var(--text)}
.ders-alt{font-size:11px;color:var(--text3)}
.ders-badge{
  font-size:9px;padding:3px 8px;border-radius:99px;
  background:rgba(210,169,65,.15);color:var(--gold-dark);
  border:1px solid rgba(210,169,65,.3);white-space:nowrap;
}

/* ALERT BANNERS */
.alert{border-radius:var(--radius-sm);padding:13px 16px;margin:6px 16px;font-size:13px;line-height:1.6}
.a-gold{background:rgba(201,168,76,.15);border:1.5px solid rgba(201,168,76,.4);color:var(--gold-dark);font-weight:500}
.a-red{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
.a-green{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.a-blue{background:var(--blue-bg);border:1px solid rgba(90,122,154,.25);color:var(--blue)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:opacity .2s}
.btn:active{opacity:.85}
.btn-primary{background:linear-gradient(135deg,var(--gold-deep),var(--gold-dark));color:white;border:none;box-shadow:0 3px 12px rgba(148,108,24,.25)}
.btn-ghost{background:transparent;border-color:var(--border2);color:var(--text2)}
.btn-wa{background:#25D366;color:white;border:none}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:99px}
.b-pilates{background:rgba(148,108,24,.1);color:var(--gold-dark);border:1px solid rgba(148,108,24,.25);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600}
.b-ems{background:rgba(210,169,65,.1);color:var(--gold);border:1px solid rgba(210,169,65,.3);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600}

/* FORMS */
select,input,textarea{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;color:var(--text);
  font-size:14px;width:100%;outline:none;
}
select:focus,input:focus{border-color:var(--gold)}

/* OGRENCİ KARTI */
.ogr-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  margin:0 16px 10px;
  box-shadow:0 1px 8px rgba(148,108,24,.05);
}
.ogr-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px}
.ogr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.progress-wrap{margin:8px 0 4px}
.progress-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));border-radius:2px;transition:width .4s}

/* TAKVIM */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 16px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s;padding:2px}
.cal-cell:hover{background:var(--bg3)}
.cal-cell.has-ders{background:#F9EFBD;border:1px solid #D4C8B0;color:#946C18;font-weight:600}
.cal-cell.tatil{background:#FFF0EC;border:1px solid #F4B8A8;color:#C03010;font-weight:600}
.cal-cell.tatil.has-ders{background:#FFE8E0;border:1px solid #F4B8A8;color:#C03010}
.cal-cell.today{background:white;border:2px solid #946C18;color:#946C18;font-weight:700}
.cal-cell.today.has-ders{background:#F5EAC0;border:2px solid #946C18}
.cal-cell.other-month{color:var(--text3)}

/* GELİR GIDER */
.gelir-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--border);
}
.gelir-icon{font-size:18px}
.gelir-info{flex:1}
.gelir-acik{font-size:13px;color:var(--text);font-weight:500}
.gelir-tarih{font-size:11px;color:var(--text3)}
.gelir-tutar{font-size:15px;font-weight:700}
.gelir-plus{color:var(--green)}
.gelir-minus{color:var(--red)}

/* RESPONSIVE */
@media(min-width:768px){
  body{background:var(--bg3)}
  #app{max-width:480px;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.1)}
  .top-bar{border-radius:0}
  /* login-screen tam ekran */
  #splash{max-width:100%;margin:0}
}

/* GOLD SHIMMER animation */
@keyframes shimmer{
  0%{background-position:-200% center}
  100%{background-position:200% center}
}
.gold-shimmer{
  background:linear-gradient(90deg,var(--gold-deep),var(--gold-light),var(--gold-dark));
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 3s linear infinite;
}

/* LOADING BAR */
#yl-bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:9999;background:linear-gradient(90deg,var(--cream),var(--gold-light),var(--gold),var(--gold-dark));animation:loadBar 1.5s ease infinite}
@keyframes loadBar{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}

/* ── RESPONSIVE ── */
@media(min-width:768px){
  body{background:#EDE8DC}
  #app{
    max-width:1400px;
    margin:0 auto;
    background:var(--bg);
    box-shadow:0 0 40px rgba(148,108,24,.08);
    height:100vh;
    overflow:hidden;

/* Öğrenci detayı */
.ds-detay{max-width:720px !important}
.ds-detay-bas{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ds-detay-izgara{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.ds-kutu{border:1px solid var(--ds-line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ds-kutu small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ds-ink5)}
.ds-kutu b{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:500;line-height:1.1}
.ds-kutu span{font-size:11.5px;color:var(--ds-ink5)}
.ds-kutu-kirmizi{background:#FBF1EF;border-color:#EBCFC9}
.ds-kutu-kirmizi b{color:#8E3A30}
.ds-mini-liste{border:1px solid var(--ds-line);border-radius:12px;max-height:260px;overflow:auto}
.ds-mini-liste>div{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--ds-stone);font-size:12.5px}
.ds-mini-liste>div:first-child{border-top:0}
.ds-mini-liste>div>span:first-child{color:var(--ds-ink5);flex:none;min-width:84px}
.ds-mini-liste>div>span:nth-child(2){flex:1;min-width:0}
.ds-mini-liste .ds-durum{flex:none !important}
@media(min-width:700px){.ds-detay-izgara{grid-template-columns:repeat(4,1fr)}.ds-detay-kolon{display:grid;grid-template-columns:1fr 1fr;gap:16px}}
/* Doluluk */
.ds-doluluk-kap{overflow-x:auto;padding:12px !important}
.ds-doluluk{border-collapse:separate;border-spacing:4px;width:100%;min-width:520px;font-size:11px}
.ds-doluluk th{font-weight:500;color:var(--ds-ink5);font-size:10.5px;letter-spacing:.06em}
.ds-doluluk tbody th{text-align:left;font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;color:var(--ds-ink);padding-right:4px}
.ds-doluluk td{border-radius:8px;text-align:center;padding:6px 2px;line-height:1.35}
.ds-doluluk td span{display:block}
.ds-doluluk td.bos{color:var(--ds-ink3);background:var(--ds-paper)}
.ds-doluluk td.kismi{background:var(--ds-goldbg);color:var(--ds-gold7);border:1px solid var(--ds-goldline)}
.ds-doluluk td.dolu{background:var(--ds-ink);color:var(--gold-light)}
/* Notlar ve toplu mesaj */
.ds-renkler{display:flex;gap:6px}
.ds-renkler input{display:none}
.ds-renkler i{display:block;width:24px;height:24px;border-radius:50%;border:1px solid var(--border2);cursor:pointer}
.ds-renkler input:checked+i{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ds-gold6)}
.ds-notlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ds-not-kart{position:relative;border:1px solid var(--ds-line);border-radius:14px;padding:16px}
.ds-not-sil{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--ds-ink3);cursor:pointer;font-size:15px}
.ds-not-sil:hover{color:var(--red)}
.ds-not-metin{font-size:13.5px;color:var(--ds-ink7);line-height:1.6;white-space:pre-wrap;padding-right:18px}
.ds-secim-sat{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--ds-stone);cursor:pointer;font-size:14px}
.ds-secim-sat:first-child{border-top:0}
.ds-secim-sat input{width:18px !important;height:18px;flex:none;accent-color:#1A1714}
.ds-secim-sat span:nth-child(2){flex:1}
/* Telefon menüsü */
.ds-menu-ov{position:fixed;inset:0;background:rgba(20,14,6,.45);z-index:9500;display:flex;align-items:flex-end}
.ds-menu{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:10px 12px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.ds-menu .snav-btn{padding:13px 12px !important;font-size:14.5px}
.ds-menu .snav-section{padding:12px 12px 4px}
.ds-menu-tutamac{width:40px;height:4px;border-radius:4px;background:var(--ds-line);margin:2px auto 8px}
/* Toplu mesaj: seçim düğmeleri */
.ds-tm-ust{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 2px 10px}
.ds-tm-secim{display:flex;gap:6px}
.ds-tm-secim .btn{height:32px;padding:0 12px !important;font-size:12px !important}
#tm-gonder:disabled{opacity:.45;cursor:not-allowed}
/* Üye paneli rehberi */
.ds-rehber-kart{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--ds-goldline);background:var(--ds-goldbg);border-radius:14px}
.ds-rehber-kart img{width:62px;height:96px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--ds-line);cursor:zoom-in;flex:none;background:#0a0a0a}
.ds-rehber-kart b{display:block;font-size:13.5px;color:var(--ds-ink);margin-bottom:2px}
.ds-rehber-kart small{display:block;font-size:11.5px;color:var(--ds-ink5);line-height:1.5;margin-bottom:8px}
.ds-rehber-kart .btn{height:32px;padding:0 12px !important;font-size:12px !important}
.ds-rehber-buyuk{max-width:460px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.ds-rehber-buyuk>div:first-child{overflow:auto;flex:1;min-height:0}
.ds-rehber-buyuk img{width:100%;display:block}
.ds-rehber-buyuk .ds-secim-btnlar{flex:none;padding:12px 14px;border-top:1px solid var(--ds-line);background:#fff}
</style>
</head>

async function girisYap() {
  const eposta = document.getElementById('login-eposta').value.trim();
  const sifre = document.getElementById('login-sifre').value;
  const hataEl = document.getElementById('login-hata');
  const btn = document.getElementById('login-btn');
  const hata = (mesaj) => {
    hataEl.textContent = mesaj; hataEl.style.display = 'block';
    const input = document.getElementById('login-sifre');
    input.style.borderColor='var(--red)';
    input.style.animation='shake .3s ease';
    setTimeout(()=>{ input.style.borderColor=''; input.style.animation=''; },1200);
  };
  hataEl.style.display = 'none';
  if (!eposta || !sifre) { hata('E-posta ve şifrenizi girin.'); return; }
  btn.disabled = true; btn.style.opacity = '.6';
  try {
    const { error } = await sb.auth.signInWithPassword({ email: eposta, password: sifre });
    if (error) { hata('E-posta veya şifre hatalı.'); return; }
    const { data: yonetici } = await sb.rpc('is_admin');
    if (yonetici !== true) { await sb.auth.signOut(); hata('Bu hesabın yönetici yetkisi yok.'); return; }
    const ls = document.getElementById('login-screen');
    ls.style.opacity = '0';
    setTimeout(() => { ls.style.display = 'none'; gosterApp(); }, 450);
  } catch (e) {
    hata('Bağlantı hatası: ' + e.message);
  } finally {
    btn.disabled = false; btn.style.opacity = '1';
  }
}

function bugun(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
let _kaloriGirmeyenler=[];
async function renderKaloriTakip() {
  const el = document.getElementById('kaloritakip-c');
  el.innerHTML = '<div class="section-title">🔥 ÖĞRENCİ KALORİLERİ</div><div style="padding:20px;text-align:center"><div class="spinner"></div></div>';

  const { data: kayitlar, error } = await sb.from('kalori_kayitlari').select('*').order('tarih', { ascending: false });
  if (error) { el.innerHTML = `<div class="section-title">🔥 ÖĞRENCİ KALORİLERİ</div><div style="padding:0 16px;color:var(--red);font-size:12px">Yüklenemedi: ${error.message}</div>`; return; }

  const bugunStr = bugun();
  const gruplar = {};
  (kayitlar || []).forEach(k => { (gruplar[k.ogrenci_id] = gruplar[k.ogrenci_id] || []).push(k); });

  const satirlar = (data || []).map(o => {
    const kk = (gruplar[o.id||o._id] || []).sort((a, b) => b.tarih.localeCompare(a.tarih));
    const bugunKal = kk.find(k => k.tarih === bugunStr)?.kalori;
    const son7 = kk.slice(0, 7);
    const ort7 = son7.length ? Math.round(son7.reduce((s, k) => s + k.kalori, 0) / son7.length) : null;
    return { ad: o.ad, tel: o.tel, tur: o.tur, bugunKal, ort7, girdi: !!bugunKal };
  });

  _kaloriGirmeyenler = satirlar.filter(s => !s.girdi && s.tel);

  el.innerHTML = `
  <div class="section-title">🔥 ÖĞRENCİ KALORİLERİ</div>
  <div style="padding:0 16px">
    <div style="font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.7">
      Öğrencilerin kendi panellerine girdiği günlük kalori verileridir. Bugün girmeyenlere WhatsApp ile hatırlatma gönderebilirsiniz.
    </div>
    ${_kaloriGirmeyenler.length ? `<button class="btn btn-wa" style="width:100%;margin-bottom:14px" onclick="kaloriTopluHatirlat()">📱 Bugün Girmeyenleri Hatırlat (${_kaloriGirmeyenler.length})</button>` : ''}
    ${!satirlar.length ? '<div style="font-size:12px;color:var(--text3);padding:12px 0">Kayıtlı öğrenci yok.</div>' : `
    <div class="card" style="padding:0;overflow:hidden">
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr style="background:var(--bg2);text-align:left">
            <th style="padding:10px 14px;font-size:11px;color:var(--text3)">ÖĞRENCİ</th>
            <th style="padding:10px 14px;font-size:11px;color:var(--text3)">BUGÜN</th>
            <th style="padding:10px 14px;font-size:11px;color:var(--text3)">7 GÜN ORT.</th>
            <th style="padding:10px 14px;font-size:11px;color:var(--text3)"></th>
          </tr>
        </thead>
        <tbody>
          ${satirlar.map((s,i) => `
            <tr style="border-top:1px solid var(--border)">
              <td style="padding:10px 14px;font-size:12.5px;color:var(--text);font-weight:600">${s.ad} <span class="b-pilates" style="margin-left:6px">${s.tur === 'ems' ? 'EMS' : 'Pilates'}</span></td>
              <td style="padding:10px 14px;font-size:12.5px;color:${s.girdi ? 'var(--gold-dark)' : 'var(--text3)'}">${s.girdi ? s.bugunKal + ' kcal ✅' : '⏰ Girmedi'}</td>
              <td style="padding:10px 14px;font-size:12.5px;color:var(--text2)">${s.ort7 ? s.ort7 + ' kcal' : '—'}</td>
              <td style="padding:10px 14px;text-align:right">${(!s.girdi && s.tel) ? `<button class="btn btn-ghost btn-sm" onclick="kaloriTekilHatirlat('${s.ad.replace(/'/g,"\\'")}','${s.tel}')">📱 Hatırlat</button>` : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`}
  </div>`;
}
function kaloriHatirlatMesaji(ad){
  return `Merhaba ${ad.split(' ')[0]} 👋\n\nDumansStudio öğrenci panelinden bugünkü kalori girişinizi henüz yapmadığınızı fark ettik. Beslenme takibinizin devam etmesi için birkaç saniyenizi ayırabilir misiniz? 🙏\n\n💪 DumansStudio | Sakarya`;
}
function kaloriTekilHatirlat(ad,tel){
  const numara=(tel||'').replace(/\D/g,'');
  const intNum=numara.startsWith('0')?'90'+numara.slice(1):numara;
  window.open(`https://wa.me/${intNum}?text=${encodeURIComponent(kaloriHatirlatMesaji(ad))}`,'_blank');
}
function kaloriTopluHatirlat(){
  if(!_kaloriGirmeyenler.length){alert('Herkes bugün kalori girmiş! 🎉');return;}
  if(!confirm(`${_kaloriGirmeyenler.length} öğrenciye WhatsApp hatırlatması gönderilsin mi?`))return;
  let idx=0;
  function sonraki(){
    if(idx>=_kaloriGirmeyenler.length){alert('✅ Tüm hatırlatmalar açıldı!');return;}
    const s=_kaloriGirmeyenler[idx];
    kaloriTekilHatirlat(s.ad,s.tel);
    idx++;
    if(idx<_kaloriGirmeyenler.length) setTimeout(sonraki,1500);
  }
  sonraki();
}

      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:12.5px;color:var(--text2)">${k}</span>
        <select id="sfd-cevap-${cevapAnahtarlari.indexOf(k)}" style="padding:5px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px">
          <option value="Hayır" ${f.cevaplar[k]==='Hayır'?'selected':''}>Hayır</option>
          <option value="Evet" ${f.cevaplar[k]==='Evet'?'selected':''}>Evet</option>
        </select>
      </div>`).join('')}
    <label style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;display:block;margin-top:14px">Özel Notlar</label>

    <div style="display:flex;gap:10px">
      <button onclick="this.closest('div[style*=fixed]').remove()" style="flex:1;padding:11px;border:1px solid var(--border);background:#fff;border-radius:9px;cursor:pointer;font-size:13px">İptal</button>
      <button id="sfd-kaydet-btn" onclick="saglikFormuKaydetDuzenleme('${id}',${JSON.stringify(cevapAnahtarlari).replace(/"/g,'&quot;')})" style="flex:2;padding:11px;background:linear-gradient(135deg,#975B09,#946C18,#D2A941);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700">💾 Kaydet</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function saglikFormuKaydetDuzenleme(id, cevapAnahtarlari) {
  const btn = document.getElementById('sfd-kaydet-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  const yeniCevaplar = {};
  cevapAnahtarlari.forEach((k, i) => { yeniCevaplar[k] = document.getElementById('sfd-cevap-'+i).value; });
  const riskSayisi = Object.values(yeniCevaplar).filter(v => v === 'Evet').length;
  const payload = {
    ad: document.getElementById('sfd-ad').value.trim(),
    tel: document.getElementById('sfd-tel').value.trim(),
    dogum: document.getElementById('sfd-dogum').value.trim(),
    notlar: document.getElementById('sfd-notlar').value.trim() || 'Yok',
    cevaplar: yeniCevaplar,
    risk_sayisi: riskSayisi
  };
  const { error } = await sb.from('saglik_formlari').update(payload).eq('id', id);
  if (error) { alert('❌ Kaydedilemedi: ' + error.message); if (btn) { btn.disabled=false; btn.textContent='💾 Kaydet'; } return; }
  document.querySelectorAll('div[style*="position:fixed"]').forEach(m => { if (m.innerHTML.includes('Sağlık Formunu Düzelt')) m.remove(); });
  renderSaglikFormlari();
}





// ── RAPORLAMA ──
function renderRapor() {
  const el = document.getElementById('rapor-c');

  const aylar = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  
  let ayOptions = '';
  for(let i=0; i<12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    ayOptions += `<option value="${val}" ${i===0?'selected':''}>${aylar[d.getMonth()]} ${d.getFullYear()}</option>`;
  }
  // Önceki yıl ayları
  for(let i=12; i<24; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);

            <option value="yillik">📆 Yıllık Rapor</option>

        </div>
        <div id="ay-secici">
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px">Ay Seç</div>
          <select id="rapor-ay" style="padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card2);color:var(--text);font-size:13px">
            ${ayOptions}
          </select>
        </div>
        <div id="yil-secici" style="display:none">
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px">Yıl Seç</div>
          <select id="rapor-yil" style="padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card2);color:var(--text);font-size:13px">
            <option value="${now.getFullYear()}">${now.getFullYear()}</option>
            <option value="${now.getFullYear()-1}">${now.getFullYear()-1}</option>
            <option value="${now.getFullYear()-2}">${now.getFullYear()-2}</option>
          </select>
        </div>
        <div style="margin-top:auto">
          <button onclick="raporGoster()" class="btn btn-primary" style="padding:10px 20px">📊 Raporu Göster</button>
        </div>
        <div style="margin-top:auto">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

// ── SUPABASE FONKSİYONLARI ──
function ogrToRow(o) {
  return {
    id:o._id||undefined, ad:o.ad, tel:o.tel||'', mail:o.mail||'',
    tur:o.tur||'pilates', paket:o.paket||20, ucret:o.ucret||0,
    toplam_paket:o.toplam_paket||o.paket||20,
    baslangic:o.baslangic||null, yapilan:o.yapilan||0, borc:o.borc||0,
    saat:o.saat||'', gunler:o.gunler||[], iptal_hakki:o.iptalHakki??1,
    iptal_gecmisi:o.iptalGecmisi||[], odeme_bekliyor:o.odemeBekliyor||false,
    ilk_odeme_alindi:o.ilkOdemeAlindi??true,
    borc_tl:o.borcTl||0, dogum_tarihi:o.dogumTarihi||null, davet_eden:o.davetEden||null
  };
}
function rowToOgr(r) {
  return {
    _id:r.id, ad:r.ad, tel:r.tel||'', mail:r.mail||'',
    tur:r.tur||'pilates', paket:r.paket||20, ucret:r.ucret||0,
    toplam_paket:r.toplam_paket||r.paket||20,
    baslangic:r.baslangic||null, yapilan:r.yapilan||0, borc:r.borc||0,
    saat:r.saat||'', gunler:r.gunler||[], iptalHakki:r.iptal_hakki??1,
    iptalGecmisi:r.iptal_gecmisi||[], odemeBekliyor:r.odeme_bekliyor||false,
    ilkOdemeAlindi:r.ilk_odeme_alindi??true,
    borcTl:+r.borc_tl||0, dogumTarihi:r.dogum_tarihi||null, davetKodu:r.davet_kodu||'', davetEden:r.davet_eden||null,
    // Giriş hesabı ve analiz paketi yalnızca kendi düğmeleriyle değişir (ogrToRow'a bilerek eklenmedi).
    _authId:r.auth_id||null, analizPaketi:r.analiz_paketi===true, _telKayitli:r.tel||''
  };
}
function gelirToRow(g) { return {id:g._id||undefined,tip:g.tip,tutar:g.tutar,acik:g.acik||'',tarih:g.tarih,ogrenci_id:g.ogrenciId||null}; }
function rowToGelir(r) { return {_id:r.id,tip:r.tip,tutar:+r.tutar||0,acik:r.acik||'',tarih:r.tarih,ogrenciId:r.ogrenci_id||null}; }

async function veriYukle() {
  const [{data:ogrs,error:e1},{data:gelirs,error:e2}] = await Promise.all([
    sb.from('ogrenciler').select('*').order('created_at',{ascending:true}),
    sb.from('gelir_gider').select('*').order('tarih',{ascending:false}),
    ekVeriYukle()
  ]);
  if(!e1 && ogrs) data = ogrs.map(rowToOgr);
  if(!e2 && gelirs) gelirData = gelirs.map(rowToGelir);
}
async function ogrKaydet(o) {
  const row = ogrToRow(o);
  if(o._id) {
    // Ders sayacı ve iptal geçmişi yalnızca yoklama üzerinden değişir; eski ekrandaki değer gece işlenen dersin üzerine yazılmasın.
    delete row.yapilan; delete row.iptal_gecmisi;
    const {error} = await sb.from('ogrenciler').update(row).eq('id',o._id);
    if(error) throw error;
    // Telefon değiştiyse öğrencinin giriş bilgisi de yeni numaraya taşınır (şifresi aynı kalır).
    if(o._authId && (o.tel||'') !== (o._telKayitli||'')) {
      try { await hesapFonksiyonu({islem:'eposta_guncelle', ogrenci_id:o._id}); o._telKayitli = o.tel||''; }
      catch(e) { alert('⚠️ Telefon kaydedildi ama giriş bilgisi güncellenemedi: '+e.message); }
    }
  } else {
    const {data:d,error} = await sb.from('ogrenciler').insert(row).select().single();
    if(error) throw error;
    o._id = d.id;
    saglikFormuEslestir(o._id, o.tel);
  }
}
async function saglikFormuEslestir(ogrenciId, tel) {
  const digits = (tel||'').replace(/\D/g,'');
  if (!digits) return;
  try {
    const { data: eslesen } = await sb.from('saglik_formlari').select('id').is('ogrenci_id', null).ilike('tel', '%'+digits.slice(-9)+'%');
    if (eslesen && eslesen.length) {
      const ids = eslesen.map(f => f.id);
      await sb.from('saglik_formlari').update({ ogrenci_id: ogrenciId }).in('id', ids);
    }
  } catch (e) { console.error('Sağlık formu eşleştirme hatası:', e); }
}
async function gelirKaydet(g) {
  const {error} = await sb.from('gelir_gider').insert(gelirToRow(g));
  if(error) throw error;
}
async function gelirSilDB(id) {
  const {error} = await sb.from('gelir_gider').delete().eq('id',id);
  if(error) throw error;
}

// ── YARDIMCI ──
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function kalanDers(o){
  // Toplam paket = tüm paketlerin toplamı (toplam_paket alanı varsa onu kullan)
  const toplamPaket = (o.toplam_paket||o.paket||0);
  return Math.max(0, toplamPaket - (o.yapilan||0));
}
function efektifKalan(o){return kalanDers(o)-(o.borc||0)}
function getBitis(o){
  if(!o.baslangic||!o.gunler||!o.gunler.length) return null;
  const b=new Date(o.baslangic);
  let say=0,d=new Date(b);
  const gk=o.paket||20;
  while(say<gk){if(o.gunler.includes(d.getDay()))say++;if(say<gk)d.setDate(d.getDate()+1);}
  return d;
}
function gecikmiMi(o){
  const bit=getBitis(o);
  if(!bit) return false;
  return bit<new Date() && kalanDers(o)>0;
}
function gunAdi(g){return ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'][g]||''}
function gosterYukleniyor(){let el=document.getElementById('yl-bar');if(!el){el=document.createElement('div');el.id='yl-bar';document.body.appendChild(el);}}
function gizleYukleniyor(){const el=document.getElementById('yl-bar');if(el)el.remove();}

    </div>
    <div class="metric-card">
      <div class="metric-label">NET KÂR</div>
      <div style="font-size:22px;font-weight:700;color:var(--gold-dark);font-family:Georgia,serif;margin:4px 0">₺${(buAyGelir-buAyGider).toLocaleString('tr-TR')}</div>
    </div>
  </div>`;

  // Bu ayın ödeme özeti (dokununca Aylık Özet açılır)
  html += `<div class="ds-ana-ozet-wrap">${aylikOzetKarti()}</div>`;

  // Uyarılar
  const sonDers = data.filter(o=>efektifKalan(o)<=3&&efektifKalan(o)>0);

  if(odBekl.length) html+=`<div style="font-size:11px;font-weight:600;color:#A0203A;letter-spacing:1px;padding:14px 16px 6px">💳 ÖDEME BİLDİRİMİ</div>`+odBekl.map(o=>`<div class="alert a-gold" style="cursor:pointer" onclick="odemeOnayla(${data.indexOf(o)})">✅ ${o.ad} ödeme yaptığını bildirdi. <strong>Onayla →</strong></div>`).join('');

async function renderAnaOlcumOzeti() {
  try {
    const {data:olcumD} = await sb.from('olcumler')
      .select('ogrenci_id,kilo,yag_yuzdesi,kas_yuzdesi,tarih')
      .order('tarih',{ascending:false})
      .limit(50);
    
    if(!olcumD||!olcumD.length) return;
    
    // Her öğrenci için son 2 ölçümü al
    const ogrMap = {};
    olcumD.forEach(o=>{
      if(!ogrMap[o.ogrenci_id]) ogrMap[o.ogrenci_id]=[];
      if(ogrMap[o.ogrenci_id].length<2) ogrMap[o.ogrenci_id].push(o);
    });
    
    // Değişim olan öğrencileri filtrele
    const degisimler = [];
    Object.entries(ogrMap).forEach(([ogrid, ols])=>{
      if(ols.length<2) return;
      const ogr = data.find(d=>d._id===ogrid||d._id==ogrid);
      if(!ogr) return;
      const fark = ((ols[0].kilo||0)-(ols[1].kilo||0)).toFixed(1);
      degisimler.push({
        ad:ogr.ad.split(' ')[0],
        son:ols[0].kilo,
        fark:parseFloat(fark),
        tarih:ols[0].tarih
      });
    });
    
    if(!degisimler.length) return;
    
    // Özet kartı ekle
    const anaEl = document.getElementById('ana-c');
    if(!anaEl) return;
    
    const ozDiv = document.createElement('div');
    ozDiv.style.cssText='margin:0 16px 12px';
    
    const maxFark = Math.max(...degisimler.map(d=>Math.abs(d.fark)),0.1);
    
    ozDiv.innerHTML = `<div class="section-title">📏 VÜCUT ÖLÇÜMLERİ — SON DEĞİŞİM</div>
      <div class="card" style="padding:14px 16px">
        <div style="display:flex;flex-direction:column;gap:8px">
          ${degisimler.sort((a,b)=>Math.abs(b.fark)-Math.abs(a.fark)).map(d=>{
            const barW = Math.round((Math.abs(d.fark)/maxFark)*100);
            const renk = d.fark<0?'var(--green)':d.fark>0?'var(--red)':'var(--text3)';
            const ikon = d.fark<0?'↓':d.fark>0?'↑':'→';
            return `<div style="display:flex;align-items:center;gap:10px">
              <div style="width:80px;font-size:12px;font-weight:600;color:var(--text);flex-shrink:0">${d.ad}</div>
              <div style="flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden">
                <div style="width:${barW}%;height:100%;background:${renk};border-radius:4px;transition:width .5s"></div>
              </div>
              <div style="width:60px;text-align:right;font-size:12px;font-weight:700;color:${renk};flex-shrink:0">${d.fark>0?'+':''}${d.fark} kg ${ikon}</div>
              <div style="width:40px;text-align:right;font-size:11px;color:var(--text3);flex-shrink:0">${d.son||'?'} kg</div>
            </div>`;
          }).join('')}
        </div>
        <div style="font-size:10px;color:var(--text3);margin-top:10px;text-align:right">Son 2 ölçüm karşılaştırması</div>
      </div>`;
    
    anaEl.appendChild(ozDiv);
  } catch(e) { console.log('Ölçüm özeti yüklenemedi:', e); }
}

  return `<div class="ogr-card ds-ogr">
    <div class="ds-ogr-bas">
      <div style="min-width:0">
        <div class="ds-ogr-ad ds-tik" onclick="ogrDetay('${o._id}')" title="Öğrenci detayı">${htmlKac(o.ad)}</div>
        ${o.tel?`<div class="ds-ogr-tel">${o.tel}</div>`:''}

      <button class="ds-rozet ds-rozet-btn" onclick="analizPaketiDegistir(${i})" title="Vücut Analizi ve Beslenme Paketi: açmak / kapatmak için dokunun" style="${o.analizPaketi?'color:var(--ds-gold7);border-color:var(--ds-goldline);background:var(--ds-goldbg)':''}">${dsIc('chart')}Analiz paketi ${o.analizPaketi?'açık':'kapalı'}</button>
      ${o.odemeBekliyor?'<span class="ds-rozet" style="color:var(--ds-gold7);border-color:var(--ds-goldline);background:var(--ds-goldbg)">Ödeme bildirdi</span>':''}
      ${o.borcTl>0?`<span class="ds-rozet" style="color:#8E3A30;border-color:#EBCFC9;background:#FBF1EF">Borç ${tlBicim(o.borcTl)}</span>`:''}
      ${dogumGunuBugunMu(o)?`<span class="ds-rozet" style="color:var(--ds-gold7)">${dsIc('sparkle')}Doğum günü</span>`:''}
    </div>
    <div class="ds-ilerleme"><span>${buPaket} / ${toplam} ders</span>${bit?`<span>Bitiş ${bit.toLocaleDateString('tr-TR')}</span>`:''}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${yuzde}%"></div></div>
    <div class="ds-eylem">
      <button class="btn btn-primary ds-b" onclick="dersEkle(${i})">${dsIc('plus')}Ders</button>
      <button class="btn btn-ghost ds-b" onclick="pakiYenile(${i})">${dsIc('refresh')}<span class="ds-etk">Paket</span></button>

      <button class="btn btn-ghost ds-kare" onclick="duzenle(${i})" title="Düzenle">${dsIc('edit')}</button>
      <button class="btn btn-ghost ds-kare" onclick="sifreVer(${i})" title="Panel şifresi belirle">${dsIc('key')}</button>

async function rehberPaylas(o) {
  const dokunmatik = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if (dokunmatik && rehberDosyasi && navigator.canShare && navigator.canShare({files:[rehberDosyasi]})) {
    try { await navigator.share({files:[rehberDosyasi], text:rehberMesaji(o, false)}); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  if (o && o.tel) waAcMetin(o.tel, rehberMesaji(o, true));
  else window.open(REHBER_LINK, '_blank', 'noopener');
}
function rehberOnizle(o) {
  rehberHazirla();
  const ov = document.createElement('div'); ov.className = 'ds-secim-ov';
  ov.innerHTML = `<div class="ds-secim ds-rehber-buyuk">
      <div><img src="${REHBER_DOSYA}" alt="Üye paneli kullanım rehberi"></div>
      <div class="ds-secim-btnlar ds-yan"><button class="btn btn-ghost" data-kapat="1">Kapat</button>${o && o.tel ? `<button class="btn btn-primary" data-gonder="1">${dsIc('msg')}WhatsApp ile gönder</button>` : ''}</div>
    </div>`;
  ov.addEventListener('click', e => {
    if (e.target === ov || e.target.closest('[data-kapat]')) ov.remove();
    else if (e.target.closest('[data-gonder]')) rehberPaylas(o);
  });
  document.body.appendChild(ov);
}

async function sifreVer(i) {
  const o = data[i];
  if(!o._id) return;
  if(!o.tel || o.tel.replace(/\D/g,'').length < 10) { alert('❌ Önce öğrencinin telefon numarasını kaydedin.'); return; }
  const soru = o._authId
    ? `${o.ad} için YENİ şifre oluşturulsun mu?\nEski şifre geçersiz olur.\n\nKendiniz belirlemek için en az 6 karakter yazın, otomatik 6 haneli şifre için boş bırakın:`
    : `${o.ad} için panel şifresi oluşturulacak.\n\nKendiniz belirlemek için en az 6 karakter yazın, otomatik 6 haneli şifre için boş bırakın:`;
  const girilen = prompt(soru, '');
  if(girilen === null) return;
  if(girilen && girilen.trim().length < 6) { alert('❌ Şifre en az 6 karakter olmalı.'); return; }
  gosterYukleniyor();
  try {
    const r = await hesapFonksiyonu({islem:'sifre_belirle', ogrenci_id:o._id, sifre:girilen.trim()||undefined});
    await veriYukle(); renderOgr();
    sifreListesiGoster([r], []);
  } catch(e) { alert('Hata: '+e.message); }
  finally { gizleYukleniyor(); }
}
async function topluSifre() {
  const eksik = data.filter(o=>!o._authId).length;
  if(!eksik) { alert('✅ Tüm öğrencilerin panel şifresi var.'); return; }
  if(!confirm(`Panel şifresi olmayan ${eksik} öğrenci için otomatik 6 haneli şifre oluşturulsun mu?`)) return;
  gosterYukleniyor();
  try {
    const r = await hesapFonksiyonu({islem:'toplu_sifre'});
    await veriYukle(); renderOgr();
    sifreListesiGoster(r.sonuc||[], r.hatalar||[]);
  } catch(e) { alert('Hata: '+e.message); }
  finally { gizleYukleniyor(); }
}

// Seçilen seçeneğin "deger"ini, kapatılırsa null döndürür.
function dsSecim({ust, baslik, metin, secenekler}) {
  return new Promise(coz => {
    const ov = document.createElement('div');
    ov.className = 'ds-secim-ov';
    ov.innerHTML = `<div class="ds-secim" role="dialog" aria-modal="true">
      ${ust?`<div class="ds-eyebrow">${ust}</div>`:''}
      <div class="ds-secim-baslik">${baslik}</div>
      ${metin?`<div class="ds-secim-metin">${metin}</div>`:''}
      <div class="ds-secim-btnlar">${secenekler.map((s,k)=>`<button class="btn ${s.tip==='ana'?'btn-primary':s.tip==='tehlike'?'btn-ghost ds-tehlike':'btn-ghost'}" data-k="${k}">${s.ikon?dsIc(s.ikon):''}${s.etiket}${s.alt?`<small>${s.alt}</small>`:''}</button>`).join('')}</div>
    </div>`;
    const bitir = d => { ov.remove(); coz(d); };
    ov.addEventListener('click', e => {
      if(e.target === ov) return bitir(null);
      const b = e.target.closest('button[data-k]');
      if(b) bitir(secenekler[+b.dataset.k].deger);
    });
    document.body.appendChild(ov);
  });
}

// Ödeme kayıtları (gelir / gider) iki durumda da silinmez.
const ARSIV_SURESI = '2 yıl';
async function ogrSilDB(id, arsivle, sebep) {
  // Önce öğrencinin panel giriş hesabı kapatılır, sonra kaydı arşive taşınır ya da silinir.
  await hesapFonksiyonu({islem:'hesap_sil', ogrenci_id:id});
  const {error} = await sb.rpc('ogrenci_kaldir', {p_ogrenci_id:id, p_arsivle:!!arsivle, p_sebep:sebep||'yonetici'});
  if(error) throw error;
}
async function sil(i) {
  const o = data[i];
  const secim = await dsSecim({
    ust: 'Öğrenciyi kaldır', baslik: o.ad,
    metin: `Ödeme kayıtları her iki durumda da gelir / gider listesinde kalır. Öğrencinin panel girişi kapanır.`,
    secenekler: [
      {etiket:'Arşive kaldır', alt:`Geri dönerse tek dokunuşla geri yüklenir · ${ARSIV_SURESI} sonra silinir`, deger:'arsiv', tip:'ana', ikon:'package'},
      {etiket:'Kalıcı olarak sil', alt:'Ölçümler ve sağlık formu da silinir, geri alınamaz', deger:'sil', tip:'tehlike', ikon:'trash'},
      {etiket:'Vazgeç', deger:null}
    ]
  });
  if(!secim) return;
  if(secim==='sil' && !confirm(`${o.ad} ve tüm bilgileri kalıcı olarak silinecek. Emin misiniz?`)) return;
  gosterYukleniyor();
  try{
    if(o._id) await ogrSilDB(o._id, secim==='arsiv', 'yonetici');
    data.splice(i,1); renderOgr(); renderAna();
  }
  catch(e){alert('Hata: '+e.message);}
  finally{gizleYukleniyor();}
}

}
async function silmeTalebiUygula(id) {
  const {data:x} = await sb.from('hesap_silme_talepleri').select('*').eq('id',id).single();
  if(!x) return;
  const o = data.find(d=>d._id===x.ogrenci_id);
  const ne = x.arsiv_izni ? `arşive kaldırılacak (${ARSIV_SURESI} sonra kendiliğinden silinir)` : 'ölçümleri ve sağlık formuyla birlikte kalıcı olarak silinecek';
  if(!confirm(`${x.ad||'Öğrenci'} ${ne}. Ödeme kayıtları gelir / gider listesinde kalır. Devam edilsin mi?`)) return;
  gosterYukleniyor();
  try{
    if(o) await ogrSilDB(o._id, x.arsiv_izni, 'ogrenci_talebi');
    await sb.from('hesap_silme_talepleri').update({tamamlandi:true, tamamlanma_tarihi:new Date().toISOString()}).eq('id',id);
    await veriYukle(); renderOgr(); renderAna();
  }catch(e){alert('Hata: '+e.message);}
  finally{gizleYukleniyor();}
}

async function arsivGoster() {
  const {data:liste, error} = await sb.from('ogrenci_arsivi').select('id,ad,tel,sebep,arsiv_tarihi,silinme_tarihi').order('arsiv_tarihi',{ascending:false});
  if(error){alert('Arşiv açılamadı: '+error.message);return;}
  const ov = document.createElement('div');
  ov.className = 'ds-secim-ov';
  ov.innerHTML = `<div class="ds-secim" style="max-width:560px">
    <div class="ds-eyebrow">${dsIc('package')} Öğrenci arşivi</div>
    <div class="ds-secim-baslik">${liste.length?liste.length+' kişi arşivde':'Arşiv boş'}</div>
    <div class="ds-secim-metin">Arşivdeki öğrenciler süresi dolunca kendiliğinden silinir. Geri yüklenen öğrenciye panel şifresini yeniden vermeniz gerekir.</div>
    <div class="ds-arsiv-liste">${liste.map(a=>`<div class="ds-arsiv-sat">
      <div style="flex:1;min-width:0"><div class="ds-sat-ad">${a.ad}</div><div class="ds-kucuk">${a.tel||''} · ${new Date(a.arsiv_tarihi).toLocaleDateString('tr-TR')} tarihinde arşivlendi${a.sebep==='ogrenci_talebi'?' (öğrenci talebi)':''} · ${new Date(a.silinme_tarihi).toLocaleDateString('tr-TR')} tarihinde silinecek</div></div>
      <button class="btn btn-primary btn-sm" data-yukle="${a.id}">${dsIc('refresh')}Geri yükle</button>
      <button class="btn btn-ghost btn-sm ds-kare" data-sil="${a.id}" title="Arşivden kalıcı sil">${dsIc('trash')}</button>
    </div>`).join('')}</div>
    <div style="text-align:right;margin-top:14px"><button class="btn btn-ghost btn-sm" data-kapat="1">Kapat</button></div>
  </div>`;
  ov.addEventListener('click', async e => {
    const b = e.target.closest('button');
    if(e.target===ov || (b&&b.dataset.kapat)) return ov.remove();
    if(!b) return;
    if(b.dataset.yukle){ ov.remove(); await arsivdenYukle(b.dataset.yukle); }
    if(b.dataset.sil){
      if(!confirm('Bu kişinin arşivdeki tüm bilgileri kalıcı olarak silinecek. Emin misiniz?')) return;
      const {error} = await sb.from('ogrenci_arsivi').delete().eq('id', b.dataset.sil);
      if(error) return alert('Hata: '+error.message);
      ov.remove(); arsivGoster();
    }
  });
  document.body.appendChild(ov);
}
async function arsivdenYukle(arsivId) {
  gosterYukleniyor();
  try{
    const {error} = await sb.rpc('ogrenci_arsivden_yukle', {p_arsiv_id:arsivId});
    if(error) throw error;
    await veriYukle();
    duzenlemeIdx=-1; renderEkleForm();
    sp('ogr');
    alert('Öğrenci geçmiş bilgileriyle birlikte geri yüklendi. Panel girişi için kartındaki anahtar düğmesiyle yeni şifre verin; paket ve ders günlerini düzenle düğmesinden güncelleyebilirsiniz.');
  }catch(e){alert('Geri yüklenemedi: '+e.message);}
  finally{gizleYukleniyor();}
}
// Yeni öğrenci eklenirken aynı telefon arşivde varsa sorulur. true dönerse kayıt işlemi durdurulur.
async function arsivEslesmesiSor(tel) {
  const t10 = (tel||'').replace(/\D/g,'').slice(-10);
  if(t10.length!==10) return false;
  const {data:ar} = await sb.from('ogrenci_arsivi').select('id,ad,arsiv_tarihi').eq('tel10',t10).order('arsiv_tarihi',{ascending:false}).limit(1);
  if(!ar || !ar.length) return false;
  const secim = await dsSecim({
    ust:'Bu telefon arşivde kayıtlı', baslik: ar[0].ad,
    metin:`${new Date(ar[0].arsiv_tarihi).toLocaleDateString('tr-TR')} tarihinde arşive kaldırılmış. Geri yüklerseniz eski ölçümleri, sağlık formu ve ders geçmişi geri gelir.`,
    secenekler:[
      {etiket:'Arşivden geri yükle', deger:'yukle', tip:'ana', ikon:'refresh'},
      {etiket:'Yeni kayıt olarak ekle', alt:'Arşivdeki bilgiler olduğu gibi kalır', deger:'yeni'},
      {etiket:'Vazgeç', deger:null}
    ]
  });
  if(secim==='yukle'){ await arsivdenYukle(ar[0].id); return true; }
  return secim===null;
}

// ── AYLIK ÖZET: bu ay ne kadar alındı, ne kadar daha alınacak ──
// "Alınan": gelir_gider tablosundaki o ayın gelir kayıtları.
// "Beklenen": her öğrencinin kalan dersi ve ders günleri ileriye doğru sayılarak paketinin biteceği gün bulunur;
// yeni paket ücreti (ogrenciler.ucret) o gün beklenir. Ay içinde paket birden fazla kez bitiyorsa her biri sayılır.
// İlk ödemesi alınmamış, ödeme bildirmiş ya da paketi bitmiş öğrencilerin ödemesi bu ay "gecikmiş / bekleyen" sayılır.
let aylikOfset = 0;
let aylikHedef = null;
const AY_ADLARI = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const tlBicim = n => '₺' + Math.round(n||0).toLocaleString('tr-TR');
function gunBas(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function dersGunuMu(o,d){return (o.gunler||[]).includes(d.getDay()) && !tatilMi(d.getFullYear(),d.getMonth(),d.getDate());}
// basTarih dahil, n. dersin tarihi
function nDersSonra(o,basTarih,n){
  const d=gunBas(basTarih);let say=0,guvenlik=0;
  while(guvenlik++<800){if(dersGunuMu(o,d)){say++;if(say>=n)return d;}d.setDate(d.getDate()+1);}
  return null;
}
function odemePlani(o, ayBas, aySon){
  const bugunT=gunBas(new Date());
  const olaylar=[];
  const ucret=+o.ucret||0;
  const buAyMi=bugunT>=ayBas&&bugunT<=aySon;
  const gecmisAy=gunBas(aySon)<bugunT;
  if(gecmisAy) return olaylar;
  if(!o.ilkOdemeAlindi){ if(buAyMi) olaylar.push({tarih:bugunT,tutar:ucret,durum:'ilk'}); return olaylar; }
  if(o.odemeBekliyor){ if(buAyMi) olaylar.push({tarih:bugunT,tutar:ucret,durum:'onay'}); return olaylar; }
  if(!(o.gunler||[]).length) return olaylar;
  const kalan=efektifKalan(o);
  let vade;
  if(kalan<=0) vade=bugunT;
  else vade=nDersSonra(o,bugunT,kalan+1); // yeni paketin ilk dersi = ödeme günü
  const bit=getBitis(o);
  const suresiDoldu=!!(bit && gunBas(bit)<bugunT && kalan>0);
  if(suresiDoldu) vade=bugunT;
  const paket=o.paket||20;
  let ilk=true,guvenlik=0;
  while(vade && vade<=aySon && guvenlik++<12){
    if(vade>=ayBas) olaylar.push({tarih:vade,tutar:ucret,durum:ilk&&(kalan<=0||suresiDoldu)?'gecikti':'plan'});
    ilk=false;
    vade=nDersSonra(o,vade,paket+1); // yeni paket vade gününde başlar; paket+1. ders bir sonraki ödeme günüdür
  }
  return olaylar;
}

async function aylikOdemeAl(i,durum){

function aylikHesapla(ofset){
  const n=new Date();
  const ayBas=new Date(n.getFullYear(),n.getMonth()+ofset,1);
  const aySon=new Date(n.getFullYear(),n.getMonth()+ofset+1,0);
  const ayIci=g=>{const t=gunBas(g.tarih);return t>=ayBas&&t<=aySon;};
  const gelirler=gelirData.filter(g=>g.tip==='gelir'&&ayIci(g)).sort((a,b)=>a.tarih<b.tarih?1:-1);
  const giderler=gelirData.filter(g=>g.tip==='gider'&&ayIci(g));
  const alinan=gelirler.reduce((t,g)=>t+(+g.tutar||0),0);
  const gider=giderler.reduce((t,g)=>t+(+g.tutar||0),0);
  const beklenenler=[];const plansiz=[];
  data.forEach((o,i)=>{
    if(!(+o.ucret>0)){plansiz.push(o.ad+' (ücret yok)');return;}
    if(o.ilkOdemeAlindi&&!o.odemeBekliyor&&!(o.gunler||[]).length&&efektifKalan(o)>0){plansiz.push(o.ad+' (ders günü yok)');return;}
    odemePlani(o,ayBas,aySon).forEach(e=>beklenenler.push({...e,o,i}));
    // Kısmi ödemeden kalan ₺ borç bu ay alınacaklara eklenir
    if((o.borcTl||0)>0 && gunBas(new Date())>=ayBas && gunBas(new Date())<=aySon) beklenenler.push({tarih:gunBas(new Date()),tutar:o.borcTl,durum:'borc',o,i});
  });
  beklenenler.sort((a,b)=>a.tarih-b.tarih);
  const beklenen=beklenenler.reduce((t,e)=>t+e.tutar,0);
  return {ayBas,aySon,gelirler,giderler,alinan,gider,beklenenler,beklenen,plansiz};
}

let yoklamaData = [], tatilMap = {}, dersTalepleri = [], yoneticiAyar = {};
const YOKLAMA_ETIKET = {
  geldi:['Geldi','yesil'], gelmedi:['Gelmedi','kirmizi'], iptal:['İptal · hak kullanıldı','gri'],
  studyo_iptal:['Stüdyo iptali','gri'], ertelendi:['Ertelendi','altin'], telafi:['Telafi dersi','altin']
};
const DAVET_INDIRIMI = 0.10;
function tarihStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function tarihTR(s){return s?new Date(s+(String(s).length===10?'T12:00':'')).toLocaleDateString('tr-TR'):'—';}
function gunEkle(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return tarihStr(d);}
function yoklamaBul(ogrId,t){return yoklamaData.find(y=>y.ogrenci_id===ogrId&&y.tarih===t);}
function ogrIdx(id){return data.findIndex(o=>o._id===id);}
function waNumara(tel){const n=(tel||'').replace(/\D/g,'');return n.startsWith('0')?'90'+n.slice(1):(n.length===10?'90'+n:n);}
function waAcMetin(tel,metin){window.open('https://wa.me/'+waNumara(tel)+'?text='+encodeURIComponent(metin),'_blank','noopener');}
function saatDk(s){const m=String(s||"").match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):9999;}
function saatSirala(a,b){return saatDk(a)-saatDk(b);}
function htmlKac(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// Veritabanındaki tatil / stüdyo kapalı günleri, paneldeki sabit listeye eklenir.
const _tatilMiSabit = tatilMi;
tatilMi = function(yil, ay, gun){ return tatilMap[`${yil}-${pad(ay+1)}-${pad(gun)}`] || _tatilMiSabit(yil, ay, gun); };

async function ekVeriYukle(){
  const bas = gunEkle(todayStr(), -120);
  const [y, t, d, a] = await Promise.all([
    sb.from('yoklama').select('*').gte('tarih', bas),
    sb.from('tatiller').select('*'),
    sb.from('ders_talepleri').select('*').eq('durum','bekliyor').order('tarih'),
    sb.from('yonetici_ayarlar').select('anahtar,deger')
  ]);
  if(!y.error) yoklamaData = y.data||[];
  if(!t.error){ tatilMap = {}; (t.data||[]).forEach(r=>tatilMap[r.tarih]=r.ad); }
  if(!d.error) dersTalepleri = d.data||[];

// ── FORM PENCERESİ: tarih, tutar, metin sormak için ──
function dsForm({ust, baslik, metin, alanlar, onay='Kaydet', tehlike=false}){
  return new Promise(coz=>{
    const ov=document.createElement('div'); ov.className='ds-secim-ov';
    ov.innerHTML=`<form class="ds-secim" novalidate>
      ${ust?`<div class="ds-eyebrow">${ust}</div>`:''}<div class="ds-secim-baslik">${baslik}</div>
      ${metin?`<div class="ds-secim-metin">${metin}</div>`:''}
      ${alanlar.map(a=>`<label class="ds-form-alan"><span>${a.etiket}</span>${a.tip==='textarea'
        ?`<textarea name="${a.ad}" rows="3" placeholder="${a.ipucu||''}">${htmlKac(a.deger||'')}</textarea>`
        :a.tip==='select'?`<select name="${a.ad}">${a.secenekler.map(s=>`<option value="${s[0]}"${s[0]===a.deger?' selected':''}>${s[1]}</option>`).join('')}</select>`
        :`<input name="${a.ad}" type="${a.tip||'text'}" value="${htmlKac(a.deger??'')}" placeholder="${a.ipucu||''}"${a.min!=null?` min="${a.min}"`:''}${a.zorunlu?' required':''} ${a.tip==='number'?'inputmode="decimal" step="any"':''}>`}
        ${a.not?`<small>${a.not}</small>`:''}</label>`).join('')}
      <div class="ds-form-hata" hidden></div>
      <div class="ds-secim-btnlar ds-yan"><button type="button" class="btn btn-ghost" data-vazgec="1">Vazgeç</button><button type="submit" class="btn ${tehlike?'btn-ghost ds-tehlike':'btn-primary'}">${onay}</button></div>
    </form>`;
    const f=ov.querySelector('form');
    const bitir=d=>{ov.remove();coz(d);};
    ov.addEventListener('click',e=>{if(e.target===ov||e.target.dataset.vazgec)bitir(null);});
    f.addEventListener('submit',e=>{
      e.preventDefault();
      const s={};
      for(const a of alanlar){
        let v=f.elements[a.ad].value.trim();
        if(a.zorunlu&&!v){const h=f.querySelector('.ds-form-hata');h.textContent=a.etiket+' boş bırakılamaz.';h.hidden=false;return;}
        if(a.tip==='number') v=v===''?null:parseFloat(v.replace(/\./g,'').replace(',','.'));
        s[a.ad]=v;
      }
      bitir(s);
    });
    document.body.appendChild(ov);
    setTimeout(()=>f.querySelector('input,textarea,select')?.focus(),50);
  });
}

// ── YOKLAMA ──
async function yoklamaYap(ogrId, tarih, durum, aciklama, telafi, ek){
  gosterYukleniyor();
  try{
    const {error}=await sb.rpc('yoklama_isaretle',{p_ogrenci:ogrId,p_tarih:tarih,p_durum:durum,p_aciklama:aciklama||null,p_telafi:telafi||null,p_ek:!!ek});
    if(error) throw error;
    await veriYukle(); sayfayiYenile();
  }catch(e){alert('Kaydedilemedi: '+e.message);}
  finally{gizleYukleniyor();}
}
function iptalHakkiKalan(o){
  const kullanilan=(o.iptalGecmisi||[]).filter(t=>!o.baslangic||t>=o.baslangic).length;
  return Math.max(0,(o.iptalHakki??1)-kullanilan);
}
async function yoklamaDiger(ogrId, tarih){
  const o=data[ogrIdx(ogrId)]; if(!o) return;
  const hak=iptalHakkiKalan(o);
  const s=await dsSecim({ust:tarihTR(tarih)+' dersi', baslik:o.ad, metin:`Bu paket için kalan iptal hakkı: <b>${hak}</b>`, secenekler:[
    {etiket:'Öğrenci isteğiyle iptal', alt:'Ders düşmez, iptal hakkından bir eksilir', deger:'iptal', ikon:'x'},
    {etiket:'Stüdyo iptali', alt:'Ders düşmez, iptal hakkı korunur', deger:'studyo_iptal', ikon:'ban'},
    {etiket:'Ertele / telafi günü belirle', alt:'Ders düşmez; telafi günü dersi işlenir', deger:'ertelendi', ikon:'cal'},
    {etiket:'Yoklamayı temizle', alt:'Bu günün kaydını siler', deger:'temizle', ikon:'refresh'},
    {etiket:'Vazgeç', deger:null}
  ]});
  if(!s) return;
  if(s==='iptal' && hak<=0 && !confirm(`${o.ad} bu paketteki iptal hakkını kullanmış. Yine de iptal edilsin mi?`)) return;
  if(s==='temizle') return yoklamaYap(ogrId,tarih,null);
  if(s==='ertelendi'){
    const f=await dsForm({ust:'Ertele', baslik:o.ad, metin:'Telafi dersinin yapılacağı günü seçin. Boş bırakırsanız yalnızca erteleme kaydı tutulur.',
      alanlar:[{ad:'telafi',etiket:'Telafi günü',tip:'date',min:todayStr()},{ad:'aciklama',etiket:'Sebep',ipucu:'Hastalık, seyahat…'}]});
    if(!f) return;
    return yoklamaYap(ogrId,tarih,'ertelendi',f.aciklama,f.telafi||null);
  }
  const f=await dsForm({ust:s==='iptal'?'Öğrenci isteğiyle iptal':'Stüdyo iptali', baslik:o.ad, alanlar:[{ad:'aciklama',etiket:'Not (isteğe bağlı)'}], onay:'İptal et'});
  if(!f) return;
  yoklamaYap(ogrId,tarih,s,f.aciklama);
}
// Belirli bir gün dersi olması beklenen öğrenciler (ders günü + o güne telafi verilenler)
function gununOgrencileri(t){
  const gun=new Date(t+'T12:00').getDay();
  const liste=data.filter(o=>(o.gunler||[]).includes(gun) && o.ilkOdemeAlindi!==false && (!o.baslangic||o.baslangic<=t) && (efektifKalan(o)>0||yoklamaBul(o._id,t)));
  yoklamaData.filter(y=>y.tarih===t&&(y.durum==='telafi'||y.aciklama?.startsWith('Telafi'))).forEach(y=>{const o=data[ogrIdx(y.ogrenci_id)];if(o&&!liste.includes(o))liste.push(o);});
  return liste;
}

async function gunuIsle(t){
  if(!confirm(tarihTR(t)+' günü yoklaması girilmemiş dersler "geldi" olarak işlensin mi?')) return;

  catch(e){alert('Hata: '+e.message);}finally{gizleYukleniyor();}
}
async function dersEkle(i){
  const o=data[i];const t=todayStr();const y=yoklamaBul(o._id,t);
  if(y&&(y.durum==='geldi'||y.durum==='gelmedi')){
    if(!confirm(`${o.ad} için bugünkü ders zaten işlendi. Ek ders olarak bir ders daha düşülsün mü?`)) return;
    return yoklamaYap(o._id,t,'geldi',null,null,true);
  }
  if(efektifKalan(o)<=0 && !confirm(`${o.ad} öğrencisinin paketi bitmiş. Bu ders borç olarak yazılsın mı?`)) return;
  yoklamaYap(o._id,t,'geldi');
}

async function dersTalebiYanitla(id, onay){
  const d=dersTalepleri.find(x=>x.id===id); if(!d) return;
  const o=data[ogrIdx(d.ogrenci_id)]; if(!o) return;
  let durum=null, telafi=null, yanit='';
  if(onay){
    const secenekler=[{etiket:'İptal hakkından düşerek onayla', alt:`Kalan hak: ${iptalHakkiKalan(o)}`, deger:'iptal', tip:'ana'},
      {etiket:'Hak düşmeden onayla', alt:'Stüdyo iptali gibi işlenir', deger:'studyo_iptal'}];
    if(d.tip==='erteleme') secenekler.unshift({etiket:'Ertele ve telafi günü ver', alt:d.istenen_tarih?'Öğrencinin önerdiği gün: '+tarihTR(d.istenen_tarih):'Telafi gününü siz seçin', deger:'ertelendi', tip:'ana'});
    secenekler.push({etiket:'Vazgeç', deger:null});
    durum=await dsSecim({ust:'Talebi onayla', baslik:o.ad, metin:tarihTR(d.tarih)+' dersi', secenekler});
    if(!durum) return;
    if(durum==='ertelendi'){
      const f=await dsForm({ust:'Telafi günü', baslik:o.ad, alanlar:[{ad:'telafi',etiket:'Telafi günü',tip:'date',deger:d.istenen_tarih||'',min:todayStr()}]});
      if(!f) return; telafi=f.telafi||null;
    }
  }else{
    const f=await dsForm({ust:'Talebi reddet', baslik:o.ad, metin:'Ders yapılmış sayılır. Öğrenciye görünecek kısa bir açıklama yazabilirsiniz.', alanlar:[{ad:'yanit',etiket:'Açıklama',ipucu:'Ör. Ders saatine 24 saatten az kaldığı için…'}], onay:'Reddet', tehlike:true});
    if(!f) return; yanit=f.yanit||'';
  }
  gosterYukleniyor();
  try{
    const {error}=await sb.from('ders_talepleri').update({durum:onay?'onaylandi':'reddedildi',yanit:yanit||null,yanit_tarihi:new Date().toISOString()}).eq('id',id);
    if(error) throw error;
    if(onay) await sb.rpc('yoklama_isaretle',{p_ogrenci:o._id,p_tarih:d.tarih,p_durum:durum,p_aciklama:'Öğrenci talebi'+(d.aciklama?': '+d.aciklama:''),p_telafi:telafi,p_ek:false});
    else if(d.tarih<todayStr()) await sb.rpc('yoklama_isaretle',{p_ogrenci:o._id,p_tarih:d.tarih,p_durum:'gelmedi',p_aciklama:'İptal talebi reddedildi',p_telafi:null,p_ek:false});
    await veriYukle(); sayfayiYenile();
  }catch(e){alert('Hata: '+e.message);}finally{gizleYukleniyor();}
}

// ── DİKKAT LİSTELERİ: doğum günü, kayıp öğrenci, sık gelmeyen, yedek ──
function dogumGunuBugunMu(o){if(!o.dogumTarihi)return false;const n=new Date();return o.dogumTarihi.slice(5)===`${pad(n.getMonth()+1)}-${pad(n.getDate())}`;}
function sonDersTarihi(o){
  const s=yoklamaData.filter(y=>y.ogrenci_id===o._id&&y.sayim!=='yok').map(y=>y.tarih).sort().pop();
  if(s) return s; const b=getBitis(o); return b?tarihStr(b):null;
}
function kayipOgrenciler(){
  const sinir=gunEkle(todayStr(),-14);
  return data.filter(o=>efektifKalan(o)<=0&&!o.odemeBekliyor&&o.ilkOdemeAlindi!==false&&(sonDersTarihi(o)||'9999')<=sinir);
}
function sikGelmeyenler(){
  const sinir=gunEkle(todayStr(),-30);
  return data.map(o=>({o,n:yoklamaData.filter(y=>y.ogrenci_id===o._id&&y.durum==='gelmedi'&&y.tarih>=sinir).length})).filter(x=>x.n>=2);
}
function dikkatHtml(){
  let h='';
  const dg=data.filter(dogumGunuBugunMu);
  if(dg.length) h+=dg.map(o=>`<div class="alert a-gold ds-dikkat">${dsIc('sparkle')}<span><b>${htmlKac(o.ad)}</b> bugün doğum gününü kutluyor.</span><button class="btn btn-ghost btn-sm" onclick="sablonGonder('${o._id}','dogumgunu')">Kutla</button></div>`).join('');
  const k=kayipOgrenciler();
  if(k.length) h+=`<div class="alert a-red ds-dikkat">${dsIc('users')}<span><b>${k.length} öğrenci</b> paketini 2 haftadır yenilemedi: ${k.map(o=>htmlKac(o.ad)).join(', ')}</span><button class="btn btn-ghost btn-sm" onclick="topluMesajAc('kayip','geriKazanim')">Mesaj gönder</button></div>`;
  const s=sikGelmeyenler();
  if(s.length) h+=`<div class="alert a-gold ds-dikkat">${dsIc('warn')}<span>Son 30 günde 2+ kez haber vermeden gelmeyenler: ${s.map(x=>`<b>${htmlKac(x.o.ad)}</b> (${x.n})`).join(', ')}</span></div>`;
  const sy=yoneticiAyar.son_yedek?.tarih;
  if(!sy || (Date.now()-new Date(sy))/864e5>=7) h+=`<div class="alert a-blue ds-dikkat">${dsIc('save')}<span>${sy?'Son yedek '+tarihTR(sy.slice(0,10))+' tarihinde alındı.':'Henüz tam yedek alınmadı.'} Haftada bir yedek almanızı öneririz.</span><button class="btn btn-ghost btn-sm" onclick="yedekle()">Yedekle</button></div>`;
  return h;
}

// ── ÖDEME ALMA (kısmi ödeme ve ₺ borç) ──
async function odemeAlPenceresi(o, {ust, beklenen, metin}){
  const f=await dsForm({ust, baslik:o.ad,
    metin:(metin?metin+'<br>':'')+`Beklenen tutar <b>${tlBicim(beklenen)}</b>. Eksik ödenen kısım öğrencinin borcuna yazılır.`,
    alanlar:[{ad:'tutar',etiket:'Alınan tutar (₺)',tip:'number',deger:beklenen,zorunlu:true}], onay:'Ödemeyi kaydet'});
  if(!f) return null;
  if(!(f.tutar>=0)){alert('Geçerli bir tutar girin.');return null;}
  return f.tutar;
}
function odemeGeliri(o, tutar, acik){return {tip:'gelir',tutar,acik:`${o.ad} — ${acik}`,tarih:todayStr(),ogrenciId:o._id};}
async function paketOdemesiIsle(i, {ust, metin, ilk, acik}){
  const o=data[i];
  const indirim = ilk && o.davetEden ? Math.round((o.ucret||0)*DAVET_INDIRIMI) : 0;
  const beklenen=(o.ucret||0)-indirim;
  const tutar=await odemeAlPenceresi(o,{ust, beklenen, metin:metin+(indirim?`<br>Davet indirimi %${DAVET_INDIRIMI*100}: −${tlBicim(indirim)}`:'')});
  if(tutar===null) return false;
  return {tutar, eksik:Math.max(0,beklenen-tutar), acik:acik+(indirim?` (davet indirimi %${DAVET_INDIRIMI*100})`:'')};
}
async function odemeOnayla(i){
  const o=data[i];const yeniPaket=o.paket||20;const kalanMevcut=efektifKalan(o);
  const r=await paketOdemesiIsle(i,{ust:'Ödeme bildirimi',metin:`Yeni paket: ${yeniPaket} ders · mevcut kalan: ${kalanMevcut} ders${o.borc>0?` · ${o.borc} ders borcu düşülecek`:''}`,acik:`${o.tur==='ems'?'EMS':'Pilates'} paket ödemesi`});
  if(!r) return;
  data[i].odemeBekliyor=false;
  data[i].toplam_paket=(o.toplam_paket||o.paket||20)+yeniPaket-(o.borc||0);
  data[i].borc=0; data[i].baslangic=todayStr(); data[i].borcTl=(o.borcTl||0)+r.eksik;
  gosterYukleniyor();
  try{await ogrKaydet(data[i]);if(r.tutar>0)await gelirKaydet(odemeGeliri(o,r.tutar,r.acik));await veriYukle();sayfayiYenile();}
  catch(e){alert('Hata: '+e.message);}finally{gizleYukleniyor();}
}
async function ilkOdemeOnayla(i){
  const o=data[i];
  const r=await paketOdemesiIsle(i,{ust:'İlk paket ödemesi',metin:`${o.paket||20} derslik ${o.tur==='ems'?'EMS':'Pilates'} paketi`,ilk:true,acik:`${o.tur==='ems'?'EMS':'Pilates'} ilk paket`});
  if(!r) return;
  Object.assign(data[i],{ilkOdemeAlindi:true,odemeBekliyor:false,baslangic:todayStr(),yapilan:0,borc:0,borcTl:(o.borcTl||0)+r.eksik});
  gosterYukleniyor();
  try{
    await ogrKaydet(data[i]);
    await sb.from('ogrenciler').update({yapilan:0}).eq('id',o._id); // ilk pakette sayaç sıfırdan başlar
    if(r.tutar>0)await gelirKaydet(odemeGeliri(o,r.tutar,r.acik));
    await veriYukle();sayfayiYenile();
  }catch(e){alert('Hata: '+e.message);}finally{gizleYukleniyor();}
}
async function pakiYenile(i){
  const o=data[i];const yeniPaket=o.paket||20;const kalanMevcut=efektifKalan(o);
  const r=await paketOdemesiIsle(i,{ust:'Paket yenileme',metin:`Yeni paket: ${yeniPaket} ders · mevcut kalan: ${kalanMevcut} ders${o.borc>0?` · ${o.borc} ders borcu düşülecek`:''} · net kalan: ${kalanMevcut+yeniPaket-(o.borc||0)} ders`,acik:`Paket yenileme (${yeniPaket} ders)`});
  if(!r) return;
  data[i].toplam_paket=(o.toplam_paket||o.paket||20)+yeniPaket-(o.borc||0);
  data[i].borc=0; data[i].baslangic=todayStr(); data[i].borcTl=(o.borcTl||0)+r.eksik;
  gosterYukleniyor();
  try{await ogrKaydet(data[i]);if(r.tutar>0)await gelirKaydet(odemeGeliri(o,r.tutar,r.acik));await veriYukle();sayfayiYenile();}
  catch(e){alert('Hata: '+e.message);}finally{gizleYukleniyor();}
}
async function borcOdemesiAl(ogrId){
  const i=ogrIdx(ogrId);const o=data[i];if(!o)return;
  const tutar=await odemeAlPenceresi(o,{ust:'Borç / taksit ödemesi',beklenen:o.borcTl||0,metin:`Kalan borç ${tlBicim(o.borcTl||0)}`});
  if(tutar===null||tutar<=0) return;
  data[i].borcTl=Math.max(0,(o.borcTl||0)-tutar);
  gosterYukleniyor();
  try{await ogrKaydet(data[i]);await gelirKaydet(odemeGeliri(o,tutar,'Borç / taksit ödemesi'));await veriYukle();sayfayiYenile();}
  catch(e){alert('Hata: '+e.message);}finally{gizleYukleniyor();}
}
async function borcDuzenle(ogrId){
  const i=ogrIdx(ogrId);const o=data[i];if(!o)return;
  const f=await dsForm({ust:'Borcu düzenle',baslik:o.ad,metin:'Ödeme kaydı oluşturmadan borç tutarını değiştirir (ör. indirim, yanlış giriş).',alanlar:[{ad:'tutar',etiket:'Borç (₺)',tip:'number',deger:o.borcTl||0,zorunlu:true}]});

  data[i].borcTl=f.tutar;

}

      <div><div class="ds-baslik">Yoklama</div>${yk.length?`<div class="ds-mini-liste">${yk.map(y=>`<div class="ds-tik" onclick="yoklamaDiger('${o._id}','${y.tarih}')"><span>${tarihTR(y.tarih)} ${gunAdi(new Date(y.tarih+'T12:00').getDay())}</span><span class="ds-durum ds-${YOKLAMA_ETIKET[y.durum][1]}">${YOKLAMA_ETIKET[y.durum][0]}</span><span class="ds-kucuk">${htmlKac(y.aciklama||'')}</span></div>`).join('')}</div>`:'<div class="ds-bos">Henüz yoklama kaydı yok.</div>'}</div>

// ── TAKVİM: haftalık doluluk, gün detayı, stüdyo kapalı günleri, etkinlik katılımı ──
function dolulukHtml(){
  const aktif=data.filter(o=>efektifKalan(o)>0&&o.saat&&(o.gunler||[]).length);
  const saatler=[...new Set(aktif.map(o=>o.saat))].sort(saatSirala);
  if(!saatler.length) return '';
  const gunler=[1,2,3,4,5,6,0];
  return `<div class="ds-baslik" style="margin-top:6px">Haftalık doluluk</div><div class="card ds-doluluk-kap"><table class="ds-doluluk"><thead><tr><th></th>${gunler.map(g=>`<th>${gunAdi(g)}</th>`).join('')}</tr></thead><tbody>${saatler.map(s=>`<tr><th>${s}</th>${gunler.map(g=>{
    const ogrs=aktif.filter(o=>o.saat===s&&o.gunler.includes(g));
    if(!ogrs.length) return '<td class="bos">—</td>';
    const p=ogrs.filter(o=>o.tur!=='ems').length,e=ogrs.filter(o=>o.tur==='ems').length;
    const dolu=(p&&p>=3)||(e&&e>=2);
    return `<td class="${dolu?'dolu':'kismi'}" title="${htmlKac(ogrs.map(o=>o.ad).join(', '))}">${p?`<span>P ${p}/3</span>`:''}${e?`<span>E ${e}/2</span>`:''}</td>`;}).join('')}</tr>`).join('')}</tbody></table>
    <div class="ds-not" style="margin:10px 2px 0">${dsIc('users')} P: Pilates (en fazla 3 kişi) · E: EMS (en fazla 2 kişi). Koyu kutular dolu, açık kutularda yer var.</div></div>`;
}
function takvimGunDetay(g,ay,yil){
  const t=`${yil}-${pad(ay+1)}-${pad(g)}`;
  const el=document.getElementById('takvim-detay');
  const vt=tatilMap[t];const sabit=_tatilMiSabit(yil,ay,g);
  const baslik=`${g} ${AY_ADLARI[ay]} ${['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][new Date(yil,ay,g).getDay()]}`;
  let html=yoklamaListesiHtml(t,baslik)||`<div class="ds-baslik">${baslik}</div><div class="ds-bos">Bu gün planlı ders yok.</div>`;
  html+=`<div style="margin:12px 0 4px">${sabit&&!vt?`<span class="ds-kucuk">${dsIc('cal')} Resmî tatil: ${htmlKac(sabit)}</span>`
    :`<button class="btn btn-ghost btn-sm" onclick="studyoKapaliDegistir('${t}')">${dsIc(vt?'refresh':'ban')}${vt?'Kapalı gün işaretini kaldır ('+htmlKac(vt)+')':'Bu günü stüdyo kapalı olarak işaretle'}</button>`}</div>`;
  el.innerHTML=`<div style="padding:0 16px">${html}</div>`;
}
async function studyoKapaliDegistir(t){
  gosterYukleniyor();
  try{
    if(tatilMap[t]){const {error}=await sb.from('tatiller').delete().eq('tarih',t);if(error)throw error;}
    else{
      const f=await dsForm({ust:'Stüdyo kapalı',baslik:tarihTR(t),metin:'Bu günün dersleri işlenmez ve paket bitiş tarihi hesabında atlanır.',alanlar:[{ad:'ad',etiket:'Açıklama',deger:'Stüdyo kapalı',zorunlu:true}]});
      if(!f){gizleYukleniyor();return;}
      const {error}=await sb.from('tatiller').insert({tarih:t,ad:f.ad});if(error)throw error;
    }
    await veriYukle();renderTakvim();const [y,a,g]=t.split('-').map(Number);takvimGunDetay(g,a-1,y);
  }catch(e){alert('Hata: '+e.message);}finally{gizleYukleniyor();}
}
function etkinlikleriYukle(){
  if(window.DUMANS_EVENTS) return Promise.resolve(window.DUMANS_EVENTS);

const _renderTakvimEski = renderTakvim;
renderTakvim = function(){
  _renderTakvimEski();

async function notEkle(){

async function notSil(id){
  if(!confirm('Bu not silinsin mi?'))return;

// ── PDF.js WORKER ─────────────────────────────────────────────
async function pdfdenMetinCikar(file) {
  const arrayBuffer = await file.arrayBuffer();
  if (typeof pdfjsLib === 'undefined') {
    throw new Error('pdf.js yüklenmedi.');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let tamMetin = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const textContent = await page.getTextContent();
    const items = textContent.items;
    const satirlar = {};
    items.forEach(item => {
      const y = Math.round(item.transform[5]);
      if (!satirlar[y]) satirlar[y] = [];
      satirlar[y].push({ x: item.transform[4], text: item.str });
    });
    const siralanmis = Object.keys(satirlar)
      .sort((a, b) => b - a)
      .map(y => satirlar[y].sort((a, b) => a.x - b.x).map(i => i.text).join(' '));
    tamMetin += siralanmis.join('\n') + '\n';
  }
  return tamMetin;
}

function pdfVeriParse(metin) {
  const veri = {};

  function sayi(str) {
    if (!str) return null;
    const m = String(str).match(/([\d]+[,.]?[\d]*)/);
    if (!m) return null;
    const n = parseFloat(m[1].replace(',', '.'));
    return isNaN(n) ? null : n;
  }

  function bul(pattern, grupNo) {
    grupNo = grupNo || 1;
    const m = metin.match(pattern);
    return m ? sayi(m[grupNo]) : null;
  }

  // ── TARİH ──
  const tarihM = metin.match(/(\d{1,2})[./](\d{2})[./](\d{4})/);
  if (tarihM) {
    const [_, g, a, y] = tarihM;
    veri.tarih = y + '-' + String(a).padStart(2,'0') + '-' + String(g).padStart(2,'0');
  } else {
    veri.tarih = new Date().toISOString().split('T')[0];
  }

  // ── AD SOYAD ──
  // Format: "HATİCE BAŞOĞLU Sporcu Olmayan 47 160.0 75.7 ..."
  const adM = metin.match(/([A-ZÇĞIİÖŞÜ][A-ZÇĞIİÖŞÜ\s]{2,30})\s+(?:Sporcu|Normal|Obez|Zayıf)/);
  if (adM) veri.ad_soyad = adM[1].trim();

  // ── ANA TABLO SATIRI ──
  // Format: "HATİCE BAŞOĞLU Sporcu Olmayan 47 160.0 75.7 29.6 33,9 %"
  // Yaş Boy Kilo BMI Yağ% sırasıyla
  const tabloM = metin.match(/(\d{2,3})\s+(1[4-9]\d[.,]\d)\s+(\d{2,3}[.,]\d)\s+(\d{2}[.,]\d)\s+(\d{2}[.,]\d)/);
  if (tabloM) {
    veri.yas    = sayi(tabloM[1]);
    veri.boy    = sayi(tabloM[2]);
    veri.kilo   = sayi(tabloM[3]);
    veri.bmi    = sayi(tabloM[4]);
    veri.yag_yuzdesi = sayi(tabloM[5]);
  }

  // Kilo yedek: "Kilo" kelimesinden sonra 40-200 arası sayı
  if (!veri.kilo || veri.kilo < 30 || veri.kilo > 250) {
    const kiloM = metin.match(/Kilo\s+(\d{2,3}[.,]?\d*)/i);
    if (kiloM) {
      const k = sayi(kiloM[1]);
      if (k >= 30 && k <= 250) veri.kilo = k;
    }
  }

  // BMI yedek
  if (!veri.bmi) {
    const bmiM = metin.match(/BMI\s+(\d{2}[.,]\d)/i);
    if (bmiM) veri.bmi = sayi(bmiM[1]);
  }

  // Yağ% yedek - "Yağ Oranı (%)" satırından
  if (!veri.yag_yuzdesi) {
    const yagM = metin.match(/Yağ\s*Oranı\s*\(%\)\s*(\d{2,3}[,.]\d)/i);
    if (yagM) veri.yag_yuzdesi = sayi(yagM[1]);
  }

  // ── SEGMENTAL ──
  // "Yağ (%) 40.5 40.7 37.8 36.2 28.7"
  const yagSegM = metin.match(/Yağ\s*\(%\)\s+([\d.,\s]+)/i);
  if (yagSegM) {
    const vals = yagSegM[1].split(/\s+/)
      .map(v => parseFloat(v.replace(',','.')))
      .filter(v => !isNaN(v) && v > 0 && v < 100);
    if (vals[0]) veri.seg_sag_bacak_yag = vals[0];
    if (vals[1]) veri.seg_sol_bacak_yag = vals[1];
    if (vals[2]) veri.seg_sag_kol_yag   = vals[2];
    if (vals[3]) veri.seg_sol_kol_yag   = vals[3];
    if (vals[4]) veri.seg_govde_yag     = vals[4];
  }

  // "Kas(kg) 7.7 7.6 2.4 2.6 27.3"
  const kasSegM = metin.match(/Kas\s*\(kg\)\s+([\d.,\s]+)/i);
  if (kasSegM) {
    const vals = kasSegM[1].split(/\s+/)
      .map(v => parseFloat(v.replace(',','.')))
      .filter(v => !isNaN(v) && v > 0);
    if (vals[0]) veri.seg_sag_bacak_kas = vals[0];
    if (vals[1]) veri.seg_sol_bacak_kas = vals[1];
    if (vals[2]) veri.seg_sag_kol_kas   = vals[2];
    if (vals[3]) veri.seg_sol_kol_kas   = vals[3];
    if (vals[4]) veri.seg_govde_kas     = vals[4];
  }

  // ── KALORİ & METABOLİZMA ──
  // "Günlük Kalori İhtiyacı 2384 9.975"
  veri.gunluk_kalori = bul(/Günlük\s*Kalori\s*İhtiyacı\s*(\d{3,4})/i);

  // "BMR Bazal Metabolizma Hızı 1.597 6683" → 1597
  const bmrM = metin.match(/BMR\s*Bazal\s*Metabolizma[^0-9]*(\d[.,]\d{3}|\d{3,4})/i);
  if (bmrM) {
    let bmr = sayi(bmrM[1]);
    // "1.597" → 1597 (binlik nokta)
    if (bmr < 500) bmr = Math.round(bmr * 1000);
    veri.bmr = bmr;
  }

  // "İç Yağlanma 5" — ama "İç Yağlanma 5 BMI 29.6" satırı
  const icYagM = metin.match(/İç\s*Yağlanma\s*(\d{1,2})\s/i);
  if (icYagM) veri.ic_yaglama = sayi(icYagM[1]);

  // "Metabolizma Yaşı 43" — ama "Metabolizma Yaşı 43 BMR/Kilo 21" satırı
  // NOT: BMR/Kilo 21 → bunu kilo olarak alma!
  const metYasM = metin.match(/Metabolizma\s*Yaşı\s*(\d{2,3})\s/i);
  if (metYasM) veri.metabolizma_yasi = sayi(metYasM[1]);

  // "Yağ Ağırlığı(kg) 25,66"
  const yagAgirM = metin.match(/Yağ\s*Ağırlığı[^0-9]*(\d{2,3}[,.]\d{1,2})/i);
  if (yagAgirM) veri.yag_agirlik = sayi(yagAgirM[1]);

  // "Sıvı Ağırlığı (kg) 37,32"
  const siviAgirM = metin.match(/Sıvı\s*Ağırlığı[^0-9]*(\d{2,3}[,.]\d{1,2})/i);
  if (siviAgirM) veri.sivi_agirlik = sayi(siviAgirM[1]);

  // "Sıvı Oranı (%) 49.3"
  const siviOranM = metin.match(/Sıvı\s*Oranı\s*\(%\)\s*(\d{2}[.,]\d)/i);
  if (siviOranM) veri.su_yuzdesi = sayi(siviOranM[1]);

  // "Hedef Kilo 52"
  const hedefM = metin.match(/Hedef\s*Kilo\s*(\d{2,3})/i);
  if (hedefM) veri.hedef_kilo = sayi(hedefM[1]);

  // "Kemik Kütlesi 2.5"
  const kemikM = metin.match(/Kemik\s*Kütlesi\s*(\d[.,]\d)/i);
  if (kemikM) veri.kemik_kutlesi = sayi(kemikM[1]);

  // BMI yedek hesapla
  if (!veri.bmi && veri.kilo && veri.boy) {
    const boyM2 = veri.boy / 100;
    veri.bmi = Math.round((veri.kilo / (boyM2 * boyM2)) * 10) / 10;
  }

  // Temizle
  const temiz = {};
  Object.entries(veri).forEach(([k, v]) => {
    if (v !== null && v !== undefined && v !== '') temiz[k] = v;
  });
  return temiz;
}


async function pdfYukle(event) {
  const file = event.target.files[0];
  if (!file) return;
  const btn = document.getElementById('pdf-yukle-btn');
  const durum = document.getElementById('pdf-durum');
  if (btn) btn.style.opacity='0.6';
  if (durum) {
    durum.style.display = 'block';
    durum.innerHTML = '<div style="display:flex;align-items:center;gap:8px;color:var(--gold-dark);padding:8px 0"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div><span>PDF okunuyor...</span></div>';
  }
  try {
    const metin = await pdfdenMetinCikar(file);
    const veri = pdfVeriParse(metin);
    const alanSayisi = Object.keys(veri).filter(k => k !== 'tarih' && k !== 'ad_soyad').length;
    if (alanSayisi === 0) throw new Error("PDF'den veri çıkarılamadı.");
    let eslenenOgr = null;
    if (veri.ad_soyad) {
      const adNorm = veri.ad_soyad.toUpperCase().trim();
      eslenenOgr = data.find(o => {
        const oAdNorm = o.ad.toUpperCase().trim();
        return oAdNorm === adNorm || oAdNorm.includes(adNorm) || adNorm.includes(oAdNorm);
      });
    }
    pdfOnayModali(veri, eslenenOgr);
  } catch (e) {
    if (durum) durum.innerHTML = '<div class="alert a-red">❌ ' + e.message + '</div>';
    else alert('❌ ' + e.message);
  } finally {
    if (btn) btn.style.opacity='1';
    event.target.value = '';
    if (durum) setTimeout(()=>{ durum.style.display='none'; }, 4000);
  }
}

function pdfOnayModali(veri, eslenenOgr) {
  const alanlar = [
    { key: 'kilo',            label: 'Kilo (kg)',             renk: 'var(--gold-dark)' },
    { key: 'bmi',             label: 'BMI',                   renk: 'var(--blue)' },
